<script>
/* ================= BRANCHES & TERMINALS (POS outlets) ================= */
const TTYPES=[['counter','كاشير صالة','Counter'],['drive','درايف ثرو','Drive-thru'],['delivery','منفذ توصيل','Delivery desk'],['kiosk','كشك/عربة','Kiosk'],['mobile','كاشير متنقل','Mobile POS']];
function termAll(){ return S.terminals.length?S.terminals:(SEED.terminals_seed||[]).map(t=>({...t,seed:true})); }
function termsOf(b){ return termAll().filter(t=>t.branch===b&&t.active!==false); }
function termName(x){ return x.terminal||(termsOf(x.branch)[0]||{}).name||'—'; }
function renderBranches(v){
 const terms=termAll();
 head(v,T('الفروع والمنافذ','Branches & Terminals'),T('عرّف منافذ الكاشير لكل فرع — كل وردية وإقفال يُسجَّل على منفذه، وكل منفذ له عهدة افتتاحية وفرق صندوق خاص','Define POS terminals per branch — every shift and close is logged per terminal'),{addFn:()=>terminalForm(),addLabel:T('منفذ جديد','New terminal'),perm:'settings',extra:(()=>{const b=el('button','btn sm',T('＋ فرع','+ Branch'));b.onclick=()=>branchForm();if(!canDo('settings'))b.disabled=true;return b})()});
 kpis(v,[{c:'',l:T('الفروع','Branches'),v:fmt(BRS.length)},{c:'',l:T('المنافذ النشطة','Active terminals'),v:fmt(terms.filter(t=>t.active!==false).length)},{c:'',l:T('عهدة افتتاحية إجمالية','Total floats'),v:kd(sum(terms.filter(t=>t.active!==false),t=>+t.float||0),0)}]);
 if(terms[0]&&terms[0].seed&&canDo('settings'))v.appendChild(el('div','ins',`${T('المنافذ الحالية مأخوذة من فودكس (منفذ واحد لكل فرع) — ','Current terminals from Foodics — ')}<button class="btn pri sm" onclick="adoptTerminals()">${T('اعتمدها ثم أضف منافذ جديدة','Adopt, then add more')}</button>`));
 BRS.forEach(b=>{ const ts=terms.filter(t=>t.branch===b); const shifts=S.cash.filter(x=>x.branch===b);
  const rows=ts.map(t=>{ const sh=shifts.filter(x=>termName(x)===t.name); return {...t,n:sh.length,net:sum(sh,x=>+x.variance||0),short:sh.filter(x=>(+x.variance||0)<-5).length}; });
  card(v,`🏪 ${BRL(b)}`,`<div class="tw"><table><thead><tr><th>${T('المنفذ','Terminal')}</th><th>${T('النوع','Type')}</th><th class="n">${T('العهدة الافتتاحية','Float')}</th><th class="n">${T('ورديات','Shifts')}</th><th class="n">${T('صافي الفرق','Net var.')}</th><th class="n">${T('بعجز','Short')}</th><th>${T('الحالة','Status')}</th><th></th></tr></thead><tbody>${rows.map(t=>`<tr><td style="font-weight:600">${esc(t.name)}</td><td class="sub">${T((TTYPES.find(x=>x[0]===t.type)||[])[1]||t.type,(TTYPES.find(x=>x[0]===t.type)||[])[2]||t.type)}</td><td class="n num">${kd(t.float||0,0)}</td><td class="n">${fmt(t.n)}</td><td class="n num" style="color:${t.net<-5?'var(--bad)':t.net>5?'var(--good)':'inherit'}">${fmt(t.net,1)}</td><td class="n" style="color:${t.short?'var(--bad)':'inherit'}">${fmt(t.short)}</td><td>${t.active===false?'<span class="chip notstarted">'+T('موقوف','off')+'</span>':'<span class="chip active">'+T('نشط','active')+'</span>'}</td><td>${!t.seed&&canDo('settings')?`<button class="btn gh sm" onclick="terminalForm('${t.id}')">✎</button>`:''}</td></tr>`).join('')||`<tr><td colspan=8 class="sub">${T('لا منافذ — أضف واحداً','No terminals')}</td></tr>`}</tbody></table></div>`,`${ts.length} ${T('منفذ','terminals')}`); });
 card(v,T('قواعد المنافذ (ACIR · C)','Terminal rules'),['عهدة افتتاحية ثابتة لكل منفذ تُعدّ أمام شاهد عند الفتح','منفذ واحد = كاشير واحد في الوردية (لا تبديل بلا تسليم موثّق)','حدّ النقد في الدرج (مثلاً ٥٠ د.ك) — ما زاد يُودَع في الخزنة','الإلغاء والخصم اليدوي برقم مشرف على كل منفذ','فرق الصندوق يُحلّل لكل منفذ ولكل كاشير — لا للفرع ككل'].map(x=>`<div class="chk"><input type="checkbox" onchange="this.parentNode.style.opacity=this.checked?.5:1"><span>${x}</span></div>`).join(''));
}
async function adoptTerminals(){ for(const t of (SEED.terminals_seed||[])){ await dbSet('terminals/'+t.id,{name:t.name,branch:t.branch,type:t.type,float:t.float,active:true}); } toast(T('تم اعتماد المنافذ','Adopted')); }
function terminalForm(id){ const rec=id?S.terminals.find(x=>x.id===id):null; modal(id?T('تعديل منفذ','Edit terminal'):T('منفذ جديد','New terminal'),[{k:'name',l:T('اسم المنفذ (مثال: كاشير ٢ — الفحيحيل)','Name'),def:rec?rec.name:''},{k:'branch',l:T('الفرع','Branch'),type:'select',opts:BRS.map(b=>({v:b,l:BRL(b)})),def:rec?rec.branch:BRS[0]},{k:'type',l:T('النوع','Type'),type:'select',opts:TTYPES.map(t=>({v:t[0],l:T(t[1],t[2])})),def:rec?rec.type:'counter'},{k:'float',l:T('العهدة الافتتاحية (د.ك)','Opening float'),type:'number',def:rec?rec.float:50},{k:'device',l:T('اسم الجهاز في فودكس (اختياري)','Foodics device name'),def:rec?rec.device:''},{k:'active',l:T('الحالة','Status'),type:'select',opts:[{v:'1',l:T('نشط','Active')},{v:'0',l:T('موقوف','Off')}],def:rec&&rec.active===false?'0':'1'}],d=>{ d.active=d.active!=='0'; if(id)dbUpd('terminals',id,d); else dbAdd('terminals',d); toast(T('تم الحفظ','Saved')); }); }
function branchForm(id){ const rec=id?S.branches.find(x=>x.id===id):null; modal(id?T('تعديل فرع','Edit branch'):T('فرع جديد','New branch'),[{k:'name',l:T('اسم الفرع','Branch name'),def:rec?rec.name:''},{k:'code',l:T('الرمز (مثال B05)','Code'),def:rec?rec.code:''},{k:'city',l:T('المنطقة','Area'),def:rec?rec.city:''}],async d=>{ if(!d.name)return; if(id)await dbUpd('branches',id,d); else await dbSet('branches/'+(d.code||Date.now().toString(36)),{...d,active:true}); toast(T('تم الحفظ','Saved')); }); }
function syncBranches(){ const names=S.branches.filter(b=>b.active!==false).map(b=>b.name); const merged=[...new Set([...BRS_BASE,...names])]; BRS.length=0; merged.forEach(x=>BRS.push(x)); }
</script>
<script>
/* ================= v20: KPI tiles+, INSIGHTS ENGINE, FRESHNESS, EXECUTIVE REPORTS ================= */
function sparkSvg(arr,color){ if(!arr||arr.length<2)return ''; const w=88,h=30,mx=Math.max(...arr),mn=Math.min(...arr); const X=i=>i*(w-2)/(arr.length-1)+1, Y=v=>h-3-(h-8)*((v-mn)/((mx-mn)||1)); const p=arr.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(''); const c=color||'currentColor'; return `<svg class="spark" viewBox="0 0 ${w} ${h}" direction="ltr" aria-hidden="true"><path d="${p}L${X(arr.length-1).toFixed(1)},${h}L1,${h}Z" fill="${c}" opacity=".12"/><path d="${p}" fill="none" stroke="${c}" stroke-width="1.6"/><circle cx="${X(arr.length-1).toFixed(1)}" cy="${Y(arr[arr.length-1]).toFixed(1)}" r="2.2" fill="${c}"/></svg>`; }
function kpis(v,arr){ v.appendChild(el('div','kpis',arr.map(k=>{ const d=k.d; const dc=d==null||isNaN(d)?'':(d>=0.5?(k.inv?'down':'up'):d<=-0.5?(k.inv?'up':'down'):''); const dh=d==null||isNaN(d)?'':`<span class="kd ${dc}">${d>=0?'▲':'▼'} ${pct(Math.abs(d))}${k.dl?` <span style="font-weight:500;opacity:.8">${k.dl}</span>`:''}</span>`; return `<div class="kpi ${k.c||''} ${k.spark?'has-spark':''}" ${k.tip?`title="${esc(k.tip)}"`:''}><div class="kl">${k.l}</div><div class="kv num" style="font-size:${String(k.v).length>9?'15px':'23px'}">${k.v}</div>${k.s?`<div class="ks">${k.s}</div>`:''}${dh}${k.spark?sparkSvg(k.spark,k.c==='hl'?'#fff':'var(--accent)'):''}</div>`; }).join(''))); }

/* ---- Insights engine: every finding carries an annualised KWD impact and a concrete action ---- */
function insights(){
 const out=[]; const push=o=>out.push(o);
 const sr=salesRoll(), F=finRoll(), cr=cashRoll(), I=S.inventory||{}, C=S.customers||{}, M=S.menu||{}, SZ=SEED.sizes||{}, MD=SEED.modifiers||{}, PL=SEED.pricelist||{};
 const yr=sr.r30*365, ordersYr=(S.sales.orders_day||0)*365, span=(SEED.sales&&SEED.sales.days)||383;
 // 1 sales trend
 if(sr.trend<=-5)push({sev:'crit',ar:'المبيعات تتراجع',en:'Sales are sliding',why:T(`معدل ٣٠ يوم ${kd(sr.r30,0)} مقابل ${kd(sr.rp,0)} في الثلاثين السابقة (${pct(sr.trend)})`,`30d ${kd(sr.r30,0)} vs ${kd(sr.rp,0)} prior (${pct(sr.trend)})`),act:T('افتح «التنبؤ» وحدّد الفرع والفترة اللي نزلت، ثم راجع الذروة المسائية أولاً','Open Forecast; isolate branch & daypart'),kwd:Math.abs(sr.r30-sr.rp)*365,tab:'fc'});
 else if(sr.trend>=5)push({sev:'good',ar:'المبيعات في صعود',en:'Sales are climbing',why:T(`+${pct(sr.trend)} مقابل الثلاثين السابقة`,`+${pct(sr.trend)} vs prior 30d`),act:T('ثبّت المكسب: تأكد أن المخزون والعمالة يغطّيان الذروة الجديدة','Lock it in: staff & stock the new peak'),kwd:(sr.r30-sr.rp)*365,tab:'sales'});
 const planUnreal=sr.plan>sr.r30*1.3;
 if(planUnreal)push({sev:'info',ar:'الهدف اليومي غير واقعي',en:'Daily plan is unrealistic',why:T(`الهدف ${kd(sr.plan,0)}/يوم مقابل معدل فعلي ${kd(sr.r30,0)} — فجوة ${pct(100*(sr.plan-sr.r30)/sr.r30)} لا تُغلق بحملة`,`${kd(sr.plan,0)} vs actual ${kd(sr.r30,0)}`),act:T(`اضبط الهدف على ${kd(Math.round(sr.r30*1.1/10)*10,0)}/يوم (+١٠٪) في «الإعدادات» ثم ارفعه شهرياً — الهدف اللي ما ينلمس ما يحرّك أحداً`,`Set plan to ${kd(Math.round(sr.r30*1.1/10)*10,0)} (+10%) and step up monthly`),kwd:0,tab:'settings'});
 else if(sr.attain<85)push({sev:'warn',ar:'دون الهدف اليومي',en:'Below daily plan',why:T(`تحقيق ${pct(sr.attain)} من هدف ${kd(sr.plan,0)}/يوم`,`${pct(sr.attain)} of ${kd(sr.plan,0)}/day`),act:T('إمّا الهدف غير واقعي أو تحتاج رافعة: الإضافات والترقية أسرع طريق','Fix the plan or pull the add-on/upsell lever'),kwd:(sr.plan-sr.r30)*365,tab:'sales'});
 // 2 attach / add-ons
 const A=M.attach||{}; if(A.rate!=null&&A.rate<25){ const k=ordersYr*0.25*0.15; push({sev:'crit',ar:'الإضافات المدفوعة شبه معدومة',en:'Paid add-ons are ~zero',why:T(`إرفاق حقيقي ${pct(A.rate)} · مدفوع ${pct(A.rate_paid||0)} — السيرب والسكوبات والفواكه تنزل بسعر صفر`,`True attach ${pct(A.rate)}, paid ${pct(A.rate_paid||0)}`),act:T('سعّر الإضافات ذات التكلفة (٠٫١٠–٠٫٢٥ د.ك) أو اربطها بالحجم الكبير — هدف إرفاق مدفوع ٢٥٪','Price add-ons or bundle with L; target 25% paid attach'),kwd:k,tab:'menu'}); }
 // 3 upsell
 if(SZ.upsell20){ push({sev:'warn',ar:'ترقية الحجم S→L بلا سكربت',en:'No S→L upsell script',why:T(`حصة L ${pct(SZ.Lshare)} ثابتة طول السنة — تحويل ٢٠٪ من S إلى L = +${kd(SZ.upsell20,0)} على ${span} يوم`,`L share ${pct(SZ.Lshare)}; 20% S→L = +${kd(SZ.upsell20,0)}`),act:T('سؤال واحد على الكاشير «كبير؟» — ابدأ بمانجا وفراولة وشمندر (أقل من ٥٠٪ L)','One cashier question: "Large?" Start with Mango, Strawberry, Beet'),kwd:SZ.upsell20/span*365,tab:'products'}); }
 // 4 free options
 if(MD.free_cost>50)push({sev:'info',ar:'خيارات مجانية لها تكلفة',en:'Free options with real cost',why:T(`${fmt(MD.free_n)} خياراً مجانياً كلّفت ${kd(MD.free_cost,0)} (سيرب بلوبيري ${fmt((MD.free[0]||{}).qty||0)} مرة)`,`${fmt(MD.free_n)} free options cost ${kd(MD.free_cost,0)}`),act:T('سعّرها أو صغّر الحصة أو اجعلها مع L فقط','Price, shrink, or L-only'),kwd:MD.free_cost/span*365,tab:'products'});
 // 5 option data errors
 const derr=(MD.loss||[]).filter(o=>o.cost>o.price*3).length; if(derr)push({sev:'warn',ar:'أخطاء وحدات في وصفات الخيارات',en:'Unit errors in option recipes',why:T(`${derr} خيارات تكلفتها المسجّلة أضعاف سعرها (رمان ٢٠٠مل = ${fmt((MD.loss[0]||{}).cost||0,1)} د.ك) — تخرّب تقارير الربحية في فودكس`,`${derr} options with cost ≫ price`),act:T('صحّح الوحدة (مل بدل لتر) في وصفة الخيار داخل فودكس','Fix unit (ml vs L) in Foodics option recipe'),kwd:0,tab:'products'});
 // 6 high FC items
 const rp=(M.reprice||[]).filter(x=>x.fc>35); if(rp.length){ const k=rp.reduce((a,x)=>a+x.net*(x.fc-30)/100,0)/span*365; push({sev:'warn',ar:`${rp.length} أصناف تكلفة غذائها فوق ٣٥٪`,en:`${rp.length} items above 35% food cost`,why:rp.slice(0,3).map(x=>`${esc(x.name.slice(0,22))} ${pct(x.fc)}`).join(' · '),act:T('أعد التسعير أو صغّر الحصة أو راجع الوصفة — كل نقطة تكلفة على هذه الأصناف = ربح مباشر','Reprice / portion / recipe'),kwd:k,tab:'menu'}); }
 // 7 cash
 if(cr.nNoCount>0)push({sev:'crit',ar:'فرق الصندوق غير قابل للقياس',en:'Cash variance not measurable',why:T(`${fmt(cr.nNoCount)} من ${fmt(cr.nAll)} وردية أُقفلت على العهدة فقط بلا عدّ — لا يمكن كشف أي عجز حقيقي`,`${fmt(cr.nNoCount)} of ${fmt(cr.nAll)} shifts closed without a count`),act:T('عدّ الدرج كاملاً وإدخال المبلغ الفعلي قبل الإيداع — من الليلة','Full drawer count before deposit — tonight'),kwd:0,tab:'cash'});
 const fahOver=(cr.brs||[]).find(b=>b.k==='الفحيحيل'); if(fahOver&&fahOver.avg>10)push({sev:'warn',ar:'زيادة ثابتة في صندوق الفحيحيل',en:'Consistent cash overage in Fahaheel',why:T(`+${fmt(fahOver.avg,1)} د.ك/وردية على ${fahOver.n} وردية — زيادة منتظمة تعني نقداً يدخل الدرج بلا تسجيل (كاش التوصيل؟)`,`+${fmt(fahOver.avg,1)}/shift over ${fahOver.n} shifts`),act:T('طابق كاش طلبات ولا تطبيقات التوصيل مع «المتوقع» في فودكس','Reconcile delivery-app cash vs expected'),kwd:fahOver.net/40*365,tab:'cash'});
 // 8 inventory variance
 if((I.variance_pct||0)>2)push({sev:'crit',ar:'فروقات المخزون فوق الحد',en:'Inventory variance above limit',why:T(`${pct(I.variance_pct)} مقابل حد ٢٪ — على مشتريات ${kd(I.purchase_total,0)}`,`${pct(I.variance_pct)} vs 2% limit`),act:T('جرد أسبوعي للأصناف العشرة الأعلى قيمة + تسجيل الهدر لحظياً','Weekly count of top-10 value items; log waste live'),kwd:(I.purchase_total||0)*((I.variance_pct-2)/100)/span*365,tab:'inv'});
 if((I.top_share||0)>60)push({sev:'info',ar:'اعتماد شبه كامل على مورّد واحد',en:'Single-supplier dependence',why:T(`${pct(I.top_share)} من المشتريات من مورّد واحد`,`${pct(I.top_share)} from one supplier`),act:T('مورّد بديل مؤهَّل لأعلى ٥ أصناف — قبل ما تحتاجه','Qualify a backup for top-5 items'),kwd:0,tab:'sup'});
 // 9 price list mismatch
 const mism=(PL.items||[]).filter(i=>i.foodics_price!=null&&Math.abs(i.foodics_price-i.fah)>0.001); if(mism.length)push({sev:'warn',ar:'سعر فودكس يخالف القائمة المعتمدة',en:'Foodics price ≠ approved list',why:mism.map(i=>`${esc(i.foodics)} ${fmt(i.foodics_price,2)} ≠ ${fmt(i.fah,2)}`).join(' · '),act:T('وحّد السعر في فودكس مع ملف وزارة التجارة — مخالفة محتملة','Align Foodics with the MOC filing'),kwd:0,tab:'products'});
 // 10 missing inputs
 if(F.prime==null)push({sev:'info',ar:'Prime Cost غير مكتمل',en:'Prime cost incomplete',why:T('تكلفة العمالة والإيجار غير مدخلة — لا يمكن حساب صافي الربح الحقيقي','Labor & rent not entered'),act:T('أدخلهما مرة واحدة في «الإعدادات» — دقيقتان','Enter once in Settings'),kwd:0,tab:'settings'});
 // 11 anomalies last 30d
 const d=dailyTotal(); const l30=last(d,30); if(l30.length>=14){ const m=mean(l30.map(x=>x.net)), sd=Math.sqrt(mean(l30.map(x=>(x.net-m)**2))); const an=l30.filter(x=>Math.abs(x.net-m)>2*sd); if(an.length)push({sev:'info',ar:`${an.length} أيام شاذة في آخر ٣٠ يوم`,en:`${an.length} anomalous days in 30d`,why:an.map(x=>`${x.date.slice(5)} ${kd(x.net,0)}`).join(' · '),act:T('اربط كل يوم شاذ بسبب: طقس، مناسبة، عطل، حملة — وسجّله في «البلاغات»','Attribute each to a cause; log it'),kwd:0,tab:'sales'}); }
 // 12 forecast next 7 vs plan
 try{ const f=forecast(d,7); if(f){ const s7=f.sum, p7=(planUnreal?sr.r30:sr.plan)*7; if(s7<p7*0.9)push({sev:'warn',ar:'الأسبوع القادم متوقَّع دون الهدف',en:'Next week forecast below plan',why:T(`متوقع ${kd(s7,0)} مقابل ${planUnreal?'معدل ٣٠ يوم':'هدف'} ${kd(p7,0)} (MASE ${fmt(f.mase,2)})`,`${kd(s7,0)} vs ${kd(p7,0)}`),act:T('حملة قصيرة على الذروة المسائية أو باقة عائلية — قرّرها اليوم لا الأسبوع الجاي','Short evening promo / family bundle — decide today'),kwd:(p7-s7)*52,tab:'fc'}); } }catch(e){}
 // 13 stale sources
 freshness().filter(x=>x.state!=='fresh').forEach(x=>push({sev:x.state==='dead'?'warn':'info',ar:`بيانات «${x.ar}» قديمة`,en:`"${x.en}" data is stale`,why:T(`آخر تحديث ${x.last} — ${x.age} يوم`,`last ${x.last} — ${x.age}d old`),act:T('صدّر الملف من فودكس واسحبه في «استيراد»','Export from Foodics → Import tab'),kwd:0,tab:'imp'}));
 // 14 customers at risk

async function commitDocs(coll,docs,box){ let n=0,err=0; for(const d of docs){ try{ await db.doc(coll+'/'+d.id).set({...d,by:ME.id||null,at:new Date().toISOString()}); n++; }catch(e){ err++; if(e.code==='quota_exceeded'){ throw new Error(T('امتلأت قاعدة البيانات','DB full')); } } if(n%25===0&&box)box.innerHTML=`⏳ ${T('جارٍ الحفظ…','saving…')} ${n}/${docs.length}`; } return {n,err}; }

const PARSERS={
 orders:async(H,body,box)=>{ const agg={}; body.forEach(r=>{ const br=brOf(r[H.BRANCH_NAME]); if(!br)return; const k=r[H.DAY_DATE]+'_'+br; const o=agg[k]||(agg[k]={id:k,date:r[H.DAY_DATE],branch:br,net:0,orders:0,cost:0,profit:0,disc:0,void:0,src:'import',refs:new Set()}); if(H.ORDER_REFERENCE!=null){ if(o.refs.has(r[H.ORDER_REFERENCE]))return; o.refs.add(r[H.ORDER_REFERENCE]); } o.net+=num(r[H.NET_SALES]); o.orders++; o.cost+=num(r[H.COST]); o.profit+=num(r[H.PROFIT]); o.disc+=num(r[H.DISCOUNT_AMOUNT]); o.void+=num(r[H.VOID_AMOUNT]); }); const docs=Object.values(agg).map(o=>{delete o.refs; ['net','cost','profit','disc','void'].forEach(k=>o[k]=Math.round(o[k]*100)/100); return o;}); if(!docs.length)throw new Error(T('لا صفوف للفرعين','No rows for the two branches')); const {n}=await commitDocs('daily',docs,box); const to=docs.map(d=>d.date).sort().pop(); return summary(`${n} ${T('يوم/فرع','day-branch')}`,to); },
 till:async(H,body,box)=>{ const docs=[]; body.forEach(r=>{ const br=brOf(r[H.BRANCH_NAME]); if(!br)return; const op=num(r[H.OPENING_AMOUNT]), cl=num(r[H.CLOSING_AMOUNT]), ex=num(r[H.ESTIMATED_CASH]); if(op===12345)return; docs.push({id:'imp_'+r[H.DAY_DATE]+'_'+String(r[H.EMPLOYEE_NAME]||'').replace(/[^\w؀-ۿ]/g,'')+'_'+Math.round(ex*100),date:r[H.DAY_DATE],branch:br,emp:r[H.EMPLOYEE_NAME],terminal:r[H.DEVICE_NAME]||'',opening:op,closing:cl,expected:ex,variance:num(r[H.CASH_VARIANCE]),labor:num(r[H.LABOR_HOURS]),src:'import',nocount:((ex-cl)>1&&(Math.abs(cl-op)<0.01||cl===0||cl===50))}); }); const {n}=await commitDocs('cash',docs,box); return summary(`${n} ${T('وردية','shifts')}`,docs.map(d=>d.date).sort().pop()); },
 sizes:async(H,body,box)=>{ const MDO={}; ((SEED.modifiers||{}).options||[]).forEach(o=>MDO[o.mod+'|'+o.opt]=o.cost); const fb=(SEED.size_fallback_fc||28)/100; const agg={}; body.forEach(r=>{ const br=brOf(r[H.BRANCH_NAME]); if(!br)return; const k=r[H.DAY_DATE]+'_'+br; const o=agg[k]||(agg[k]={id:'sz_'+k,date:r[H.DAY_DATE],branch:br,net:0,orders:0,cost:0,qty:0,L:0,S:0,src:'import',refs:new Set()}); const net=num(r[H.NET_SALES]), q=num(r[H.QUANTITY_SOLD]); let uc=MDO[r[H.SIZE_GROUP]+'|'+r[H.SIZE_NAME]]; const up=q?net/q:0; if(uc==null||uc>up*1.5)uc=up*fb; o.net+=net; o.qty+=q; o.cost+=uc*q; o.refs.add(r[H.INVOICE_REFERENCE]); if(/\bL\b/.test(r[H.SIZE_NAME]))o.L+=q; else if(/\bS\b/.test(r[H.SIZE_NAME]))o.S+=q; }); const docs=Object.values(agg).map(o=>{o.orders=o.refs.size; delete o.refs; o.profit=o.net-o.cost; ['net','cost','profit'].forEach(k=>o[k]=Math.round(o[k]*100)/100); return o;}); const {n}=await commitDocs('sizedaily',docs,box); return summary(`${n} ${T('يوم/فرع','day-branch')}`,docs.map(d=>d.date).sort().pop()); },
 payments:async(H,body)=>{ const m={}; let tot=0, mn=null, mx=null; body.forEach(r=>{ const br=brOf(r[H.BRANCH_NAME]); if(!br)return; const a=num(r[H.NET_AMOUNT]); const k=String(r[H.PAYMENT_METHOD]||'—'); m[k]=(m[k]||0)+a; tot+=a; const d=r[H.DAY_DATE]; if(!mn||d<mn)mn=d; if(!mx||d>mx)mx=d; }); const bk=k=>/talabat|jahez|keeta|deliveroo/i.test(k)?'تطبيقات توصيل':/cash/i.test(k)?'نقد':/knet|card|visa|master|link/i.test(k)?'كنت/بطاقة':'أخرى'; const b={}; Object.entries(m).forEach(([k,v])=>{b[bk(k)]=(b[bk(k)]||0)+v}); const buckets={}; Object.entries(b).forEach(([k,v])=>buckets[k]=Math.round(1000*v/tot)/10); const methods={}; Object.entries(m).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>methods[k]=Math.round(v*10)/10); await dbSet('meta/payments',{total:Math.round(tot),period:`${mn} → ${mx}`,buckets,methods}); return summary(`${kd(tot,0)} · ${Object.keys(m).length} ${T('طريقة دفع','methods')}`,mx); },

 inventory:async(H,body,box)=>{ const byT={}, sup={}, items={}, cons={}, cnt={}; let tp=0,waste=0,theo=0,adj=0,mn=null,mx=null; body.forEach(r=>{ const t=String(r[H.TRANSACTION_TYPE]||''); const c=num(r[H.TOTAL_COST]); const d=r[H.DAY_DATE]; if(d){ if(!mn||d<mn)mn=d; if(!mx||d>mx)mx=d; } (byT[t]=byT[t]||{n:0,cost:0}); byT[t].n++; byT[t].cost+=c; const br=brOf(r[H.BRANCH_NAME]); const it=String(r[H.INVENTORY_ITEM_NAME]||'').slice(0,30); if(t==='Purchasing'&&br){ tp+=c; const s=String(r[H.SUPPLIER_NAME]||'—').slice(0,26); (sup[s]=sup[s]||{cost:0,n:0}); sup[s].cost+=c; sup[s].n++; items[it]=(items[it]||0)+c; } if(/^Consumption/.test(t)){ theo+=c; cons[it]=(cons[it]||0)+c; } if(t==='Inventory Count'){ adj+=c; cnt[it]=(cnt[it]||0)+c; } if(/Waste/.test(t))waste+=c; }); const sg=Object.entries(sup).sort((a,b)=>b[1].cost-a[1].cost); const iv=Object.entries(cons).filter(([k,v])=>v>300).map(([k,v])=>({name:k,cons:Math.round(v*10)/10,adj:Math.round((cnt[k]||0)*10)/10,var_pct:Math.round(1000*(cnt[k]||0)/v)/10})).sort((a,b)=>a.adj-b.adj).slice(0,12); await dbSet('meta/inventory_live',{purchase_total:Math.round(tp*10)/10,period:`${mn} → ${mx}`,by_type:Object.fromEntries(Object.entries(byT).map(([k,v])=>[k,{n:v.n,cost:Math.round(v.cost*10)/10}])),suppliers:sg.slice(0,14).map(([k,v])=>({name:k,cost:Math.round(v.cost*10)/10,pct:Math.round(1000*v.cost/tp)/10,n:v.n})),top_supplier:sg[0]?sg[0][0]:'—',top_share:sg[0]?Math.round(1000*sg[0][1].cost/tp)/10:0,items:Object.entries(items).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([k,v])=>({name:k,cost:Math.round(v*10)/10})),theoretical:Math.round(theo*10)/10,count_adj:Math.round(adj*10)/10,waste:Math.round(waste*10)/10,variance_pct:theo?Math.round(10000*Math.abs(adj)/theo)/100:0,item_variance:iv}); return summary(`${T('مشتريات','purchases')} ${kd(tp,0)} · ${T('فروقات','variance')} ${pct(theo?100*Math.abs(adj)/theo:0)}`,mx); },
 productline:async(H,body)=>{ const ordAll=new Set(), ordMod=new Set(), ordPaid=new Set(); const mods={}; body.forEach(r=>{ const br=brOf(r[H.BRANCH_NAME]); if(!br)return; const o=r[H.ORDER_REFERENCE]; ordAll.add(o); const m=String(r[H.MODIFIER_NAME]||'').trim(); if(!m||/size/i.test(m))return; ordMod.add(o); const net=num(r[H.NET_SALES]); if(net>0)ordPaid.add(o); (mods[m]=mods[m]||{n:0,net:0,profit:0}); mods[m].n+=num(r[H.QUANTITY]); mods[m].net+=net; mods[m].profit+=num(r[H.PROFIT]); }); const n=ordAll.size||1; const top=Object.entries(mods).sort((a,b)=>b[1].n-a[1].n).slice(0,10).map(([k,v])=>({name:k.slice(0,30),n:Math.round(v.n),net:Math.round(v.net*10)/10,profit:Math.round(v.profit*10)/10})); await dbSet('meta/menu_attach',{rate:Math.round(1000*ordMod.size/n)/10,rate_paid:Math.round(1000*ordPaid.size/n)/10,orders:n,with_mod:ordMod.size,top,note:'sizes_excluded'}); return summary(`${T('إرفاق حقيقي','true attach')} ${pct(100*ordMod.size/n)} · ${T('مدفوع','paid')} ${pct(100*ordPaid.size/n)}`,TODAY); },
 pricelist:async(H,body,box,rows)=>{ const items=[]; let grp=null; const SZ={'أطفال':'200ml','صغير':'S','كبير':'L'}; body.forEach(r=>{ const a=String(r[0]||'').trim(), f=num(r[1]), s=num(r[2]); if(a&&f&&a!=='المنتج / Product')items.push({ar:a,fah:f,sal:s||f,cat:'coffee_dessert'}); const g=String(r[4]||'').trim(); if(!g)return; if(!(g in SZ)&&!/^وسط|اكس/.test(g)&&!num(r[5])){grp=g;return;} if(g in SZ&&grp&&num(r[5]))items.push({ar:`${grp} ${g}`,group:grp,size:g,ml:parseInt(r[7])||null,fah:num(r[5]),sal:num(r[6])||num(r[5]),cat:'juice',foodics:`${grp} ${SZ[g]}`}); }); if(!items.length)throw new Error(T('لم أجد أسعاراً — تأكد من ترتيب الأعمدة','No prices found')); const prev=(S.pricelist||SEED.pricelist||{}).items||[]; items.forEach(i=>{ const p=prev.find(x=>x.ar===i.ar); if(p){ i.foodics=p.foodics; i.cost=p.cost; i.foodics_price=p.foodics_price; if(i.cost!=null){ i.fc_fah=Math.round(1000*i.cost/i.fah)/10; i.fc_sal=Math.round(1000*i.cost/i.sal)/10; } } }); await dbSet('meta/pricelist',{items,note:'MOC price list — الفحيحيل = Main، السالمية = Dine-in',at:TODAY}); return summary(`${items.length} ${T('صنف','items')}`,TODAY); },
 costs:async(H,body)=>{ const rows=body.map(r=>({month:String(r[H.month]||'').slice(0,7),labor_fah:num(r[H.labor_fah]),labor_sal:num(r[H.labor_sal]),rent_fah:num(r[H.rent_fah]),rent_sal:num(r[H.rent_sal]),opex_month:num(r[H.opex_month]),delivery_comm_pct:num(r[H.delivery_comm_pct]),headcount:num(r[H.headcount]),cash_on_hand:num(r[H.cash_on_hand]),payables:num(r[H.payables])})).filter(x=>x.month).sort((a,b)=>a.month.localeCompare(b.month)); const L=rows[rows.length-1]; if(!L)throw new Error(T('لا صفوف','No rows')); await dbSet('meta/finance',{...(S.finance||{}),...L,labor_month:L.labor_fah+L.labor_sal,rent_month:L.rent_fah+L.rent_sal,history:rows.slice(-24)}); return summary(`${T('شهر','month')} ${L.month} · ${T('عمالة','labor')} ${kd(L.labor_fah+L.labor_sal,0)}`,L.month+'-28'); },
 waste:async(H,body,box)=>{ const docs=body.map((r,i)=>({id:'w_'+r[H.date]+'_'+i+'_'+Date.now().toString(36),date:r[H.date],branch:brOf(r[H.branch])||BRS[0],item:r[H.item],qty:r[H.qty],cause:r[H.cause]||'other',value:num(r[H.value]),src:'import'})).filter(d=>d.date); const {n}=await commitDocs('waste',docs,box); return summary(`${n} ${T('سجل هدر','entries')}`,docs.map(d=>d.date).sort().pop()); },
 haccp:async(H,body,box)=>{ const docs=body.map((r,i)=>{ const c=CCP.find(x=>x[0]===r[H.ccp]); const temp=num(r[H.temp]); return {id:'h_'+r[H.date]+'_'+(r[H.slot]||'')+'_'+(r[H.ccp]||'')+'_'+i,date:r[H.date],slot:r[H.slot]||'am',branch:brOf(r[H.branch])||BRS[0],ccp:r[H.ccp],temp,action:r[H.action]||'',ok:c?(temp>=c[3]&&temp<=c[4]):true,src:'import'}; }).filter(d=>d.date); const {n}=await commitDocs('haccp',docs,box); return summary(`${n} ${T('قراءة','readings')} · ${docs.filter(d=>!d.ok).length} ${T('خارج الحد','out of range')}`,docs.map(d=>d.date).sort().pop()); },
 complaints:async(H,body,box)=>{ const docs=body.map((r,i)=>({id:'c_'+r[H.date]+'_'+i+'_'+Date.now().toString(36),date:r[H.date],branch:brOf(r[H.branch])||BRS[0],channel:r[H.channel]||'',cat:r[H.cat]||'',desc:r[H.desc]||'',resolved:/^(yes|true|1|نعم)$/i.test(String(r[H.resolved]||'')),src:'import'})).filter(d=>d.date); const {n}=await commitDocs('complaints',docs,box); return summary(`${n} ${T('شكوى','complaints')}`,docs.map(d=>d.date).sort().pop()); },
 team:async(H,body,box)=>{ const docs=body.map(r=>({id:'t_'+String(r[H.name]||'').replace(/[^\w؀-ۿ]/g,'_'),name:r[H.name],role:r[H.role]||'كاشير',branch:brOf(r[H.branch])||BRS[0],hired:r[H.hired]||'',active:!/^(no|false|0|لا)$/i.test(String(r[H.active]||'yes')),src:'import'})).filter(d=>d.name); const {n}=await commitDocs('team',docs,box); return summary(`${n} ${T('موظف','people')}`,TODAY); },
 tasks:async(H,body,box)=>{ const docs=body.map((r,i)=>({id:'k_'+String(r[H.code]||i).replace(/[^\w.]/g,'_'),goal:r[H.goal]||'',code:r[H.code]||'',title:r[H.title],owner:r[H.owner]||'',due:r[H.due]||'',status:['done','progress'].includes(r[H.status])?r[H.status]:'notstarted',src:'import',order:i})).filter(d=>d.title); const {n}=await commitDocs('tasks',docs,box); return summary(`${n} ${T('مهمة','tasks')}`,TODAY); },
};
/* role matrix on the Users tab */
const _renderUsers=renderUsers; renderUsers=function(v){ _renderUsers(v); const rows=Object.keys(ROLES).map(r=>{ const rv=ROLE_VIEWS[r]; const grps=rv?GROUPS.filter(g=>rv.groups.includes(g.k)):GROUPS; const tabs=rv&&rv.tabs?rv.tabs:null; return {r,see:grps.map(g=>T(g.ar,g.en)).join(' · ')+(tabs?` (${tabs.length} ${T('شاشات','tabs')})`:''),home:rv?rv.home:'dash',write:Object.entries(PERM).filter(([k,a])=>r==='owner'||a.includes(r)).map(([k])=>k).join(' · ')||'—'}; }); card(v,T('ماذا يرى كل دور — وماذا يستطيع إدخاله','What each role sees and can enter'),`<div class="tw"><table><thead><tr><th>${T('الدور','Role')}</th><th>${T('الشاشة الأولى','Home')}</th><th class="wrap-c">${T('يرى','Sees')}</th><th class="wrap-c">${T('يُدخل/يرفع','Can write')}</th></tr></thead><tbody>${rows.map(x=>`<tr><td><span class="role ${x.r}" style="display:inline-block;padding:2px 9px;border-radius:999px;font-weight:800;font-size:12px">${ROLES[x.r][LANG]}</span></td><td class="sub">${x.home}</td><td class="wrap-c" style="font-size:12.5px">${x.see}</td><td class="wrap-c sub" style="font-size:12px">${x.write}</td></tr>`).join('')}</tbody></table></div><p class="sub">${T('المالك يرى كل شيء. المدير: كل التشغيل والتقارير. المحلّل: القيادة والمالية والقائمة والعملاء والبيانات. الكاشير: الإقفال والصندوق والهدر وHACCP والمبيعات والجدولة فقط. المشاهد: لوحة القيادة والتحكّم والتقارير للقراءة.','Owner sees all; manager ops+reports; analyst command/finance/menu/customers/data; cashier close/cash/waste/HACCP; viewer read-only dashboards.')}</p>`); };
/* boot */
(window.__backendReady||Promise.resolve()).then(()=>{ render(); roleBadge(); initDB(); setTimeout(()=>{ if(!db)setConn(false); },1200); });
