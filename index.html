<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Latifa OS</title><style>:root{color-scheme:light dark}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><script>
/* ============================================================================
   Latifa OS — STANDALONE BACKEND ADAPTER (independent of Claude)
   يشغّل النظام على دومينك الخاص. قاعدة البيانات وتسجيل الدخول عبر Firebase (مجاني).
   ----------------------------------------------------------------------------
   الإعداد (مرة واحدة قبل الرفع):
   1) أنشئ مشروع Firebase مجاني على console.firebase.google.com
   2) فعّل: Authentication → Sign-in method → Email/Password
   3) فعّل: Firestore Database → Create database (production mode)
   4) Project settings → Your apps → Web app → انسخ firebaseConfig والصقه تحت
   5) اكتب إيميلاتكم كمُلّاك في OWNER_EMAILS (المالك يرى كل شيء)
   * إذا تركت FIREBASE_CONFIG فارغاً: يعمل النظام «وضع محلي» على هذا الجهاز فقط
     (بيانات لا تُشارك) — ويمكن ضبط Firebase لاحقاً من زر الإعداد في الأعلى.
   ============================================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCX7sWGGSOkR0bGPggF-3bvRszE_UXBZd8",
  authDomain: "latifa-os.firebaseapp.com",
  projectId: "latifa-os",
  storageBucket: "latifa-os.firebasestorage.app",
  messagingSenderId: "1063511193379",
  appId: "1:1063511193379:web:c100a737f62fdd9e053e96",
  measurementId: "G-RRQX46QQLM"
};
const OWNER_EMAILS = [ "oalsoos13@gmail.com" ];

/* -------------------------------------------------------------------------- */
window.__backendReady = (async function(){
  await new Promise(r=>{ if(document.body) r(); else document.addEventListener('DOMContentLoaded',r,{once:true}); });
  const cfg = resolveConfig();
  injectStyles();
  if (cfg && cfg.apiKey) { try { await startFirebase(cfg); return; } catch(e){ console.error(e); banner('bad', 'تعذّر الاتصال بـ Firebase: '+(e.message||e)+' — يعمل النظام محلياً مؤقتاً.'); } }
  startLocal();

  /* ---- config resolution: baked constant, else localStorage ---- */
  function resolveConfig(){
    if (FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey) return FIREBASE_CONFIG;
    try { const s = localStorage.getItem('latifa_fb_cfg'); if (s) return JSON.parse(s); } catch(e){}
    return null;
  }
  function owners(){
    let list = OWNER_EMAILS.slice();
    try { const s = localStorage.getItem('latifa_owner_emails'); if (s) list = list.concat(JSON.parse(s)); } catch(e){}
    return list.map(x=>String(x).toLowerCase());
  }

  /* ============================ FIREBASE MODE ============================ */
  async function startFirebase(cfg){
    // compat build (global firebase.*) — a drop-in for the Firestore v8-style API the app already uses
    const C='https://www.gstatic.com/firebasejs/8.10.1/';
    await loadScript(C+'firebase-app.js'); await loadScript(C+'firebase-auth.js'); await loadScript(C+'firebase-firestore.js');
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    const auth = firebase.auth(); const fs = firebase.firestore();
    let resolveReady; const ready = new Promise(r=>resolveReady=r);
    showLogin(auth);
    auth.onAuthStateChanged(user=>{
      if(!user){ showLogin(auth); return; }
      const email=(user.email||'').toLowerCase(); const isOwner=owners().length? owners().includes(email) : true; /* first-ever user with no owner list = owner */
      window.claude = {
        use: (name)=> Promise.resolve(
          name==='db' ? fs :
          name==='user' ? ({ isOwner:async()=>isOwner, id:async()=>user.uid, me:async()=>({name:user.displayName||user.email}), can:async()=>true }) :
          name==='downloads' ? DL : null )
      };
      hideLogin(); banner('ok', 'متصل بـ Firebase — '+(user.email||'')+' · بياناتك تُحفظ وتُشارك مع فريقك.', true);
      resolveReady();
    });
    setupBtn(true);
    return ready;
  }

  /* ============================= LOCAL MODE ============================== */
  function startLocal(){
    const db = makeLocalDB();
    window.claude = { use:(name)=> Promise.resolve(
      name==='db' ? db :
      name==='user' ? ({ isOwner:async()=>true, id:async()=>'local-owner', me:async()=>({name:'المالك (محلي)'}), can:async()=>true }) :
      name==='downloads' ? DL : null )};
    banner('warn','وضع محلي — البيانات على هذا الجهاز فقط ولا تُشارك. اضغط «ربط Firebase» لتفعيل المشاركة وتسجيل الدخول لفريقك.', true);
    setupBtn(false);
  }
  function makeLocalDB(){
    const LS='latifa_local_db_v1'; let store=load(); const subs=[];
    function load(){ try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return {}} }
    function persist(){ try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){} }
    function csnap(c){ const o=store[c]||{}; const docs=Object.keys(o).map(id=>({id,data:()=>o[id]})); return {empty:docs.length===0,docs}; }
    function dsnap(c,id){ const o=store[c]||{}; return {exists:(id in o),data:()=>o[id]}; }
    function emit(c,id){ subs.forEach(s=>{ if(s.c!==c)return; if(s.t==='coll')s.cb(csnap(c)); else if(s.id===id)s.cb(dsnap(c,id)); }); }
    function put(c,id,d){ (store[c]=store[c]||{})[id]=d; persist(); emit(c,id); }
    const sp=p=>{ const i=p.indexOf('/'); return [p.slice(0,i),p.slice(i+1)]; };
    return {
      collection(c){ return {
        add(d){ const id='loc_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); put(c,id,d); return Promise.resolve({id}); },
        onSnapshot(cb){ subs.push({t:'coll',c,cb}); cb(csnap(c)); return ()=>{}; } }; },
      doc(path){ const [c,id]=sp(path); return {
        set(d){ put(c,id,d); return Promise.resolve(); },
        get(){ return Promise.resolve(dsnap(c,id)); },
        update(d){ (store[c]=store[c]||{})[id]={...(store[c][id]||{}),...d}; persist(); emit(c,id); return Promise.resolve(); },
        delete(){ if(store[c]){delete store[c][id];persist();emit(c,id);} return Promise.resolve(); },
        onSnapshot(cb){ subs.push({t:'doc',c,id,cb}); cb(dsnap(c,id)); return ()=>{}; } }; }
    };
  }

  /* ---- downloads (normal browser) ---- */
  const DL = { save:({filename,data})=>{ try{ const blob = data instanceof Blob?data:new Blob([data],{type:'text/csv;charset=utf-8'}); const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=filename||'download.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); return Promise.resolve(); }catch(e){ return Promise.reject(e);} } };

  /* ---- helpers ---- */
  function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('load '+src)); document.head.appendChild(s); }); }
  function injectStyles(){ const st=document.createElement('style'); st.textContent=`
    #lf-ov{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;background:linear-gradient(150deg,#4a1a4d,#2a0f2c);padding:20px;font-family:"Tajawal","IBM Plex Sans Arabic",system-ui,sans-serif;direction:rtl}
    #lf-ov .box{background:#fff;color:#201622;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.4);width:min(400px,100%);padding:26px;text-align:center}
    #lf-ov h1{font-size:22px;margin:8px 0 2px;font-weight:900;color:#7a2b7d}
    #lf-ov p{font-size:13px;color:#645768;margin:0 0 18px}
    #lf-ov input{width:100%;font-family:inherit;font-size:15px;padding:11px 13px;border:1px solid #e6dde7;border-radius:11px;margin-bottom:10px;box-sizing:border-box;background:#faf7fa;color:#201622}
    #lf-ov button{width:100%;font-family:inherit;font-size:15px;font-weight:800;padding:12px;border:0;border-radius:11px;background:#7a2b7d;color:#fff;cursor:pointer;margin-bottom:8px}
    #lf-ov button.ghost{background:transparent;color:#7a2b7d;font-size:13px;padding:6px}
    #lf-ov .err{color:#c43c3c;font-size:12.5px;min-height:16px;margin-bottom:6px}
    #lf-badge{position:fixed;bottom:12px;inset-inline-start:12px;z-index:8000;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.15);display:flex;align-items:center;gap:8px;max-width:min(92vw,520px)}
    #lf-badge .x{cursor:pointer;opacity:.6;font-weight:900}
    #lf-badge button{font-family:inherit;font-size:11px;font-weight:800;border:0;border-radius:999px;padding:3px 9px;background:rgba(0,0,0,.12);color:inherit;cursor:pointer}
    @media(prefers-color-scheme:dark){#lf-ov .box{background:#1c1721;color:#f3eff5}#lf-ov input{background:#27202e;border-color:#322a3a;color:#f3eff5}}
  `; document.head.appendChild(st); }
  function showLogin(auth){ if(document.getElementById('lf-ov'))return; const ov=document.createElement('div'); ov.id='lf-ov'; ov.innerHTML=`
    <div class="box">
      <div style="font-size:34px">☕</div><h1>Latifa OS</h1><p>نظام تشغيل لطيفة كافيه — سجّل الدخول للمتابعة</p>
      <div class="err" id="lf-err"></div>
      <input id="lf-email" type="email" placeholder="البريد الإلكتروني" autocomplete="username">
      <input id="lf-pass" type="password" placeholder="كلمة المرور" autocomplete="current-password">
      <button id="lf-login">تسجيل الدخول</button>
      <button id="lf-signup" class="ghost">إنشاء حساب جديد</button>
      <button id="lf-reset" class="ghost">نسيت كلمة المرور</button>
    </div>`; document.body.appendChild(ov);
    const E=()=>document.getElementById('lf-email').value.trim(), P=()=>document.getElementById('lf-pass').value, err=m=>document.getElementById('lf-err').textContent=m||'';
    const wrap=fn=>async()=>{ err(''); try{ await fn(); }catch(e){ err(msg(e)); } };
    document.getElementById('lf-login').onclick=wrap(()=>auth.signInWithEmailAndPassword(E(),P()));
    document.getElementById('lf-signup').onclick=wrap(async()=>{ if(P().length<6)throw new Error('كلمة المرور ٦ أحرف على الأقل'); await auth.createUserWithEmailAndPassword(E(),P()); });
    document.getElementById('lf-reset').onclick=wrap(async()=>{ if(!E())throw new Error('اكتب بريدك أولاً'); await auth.sendPasswordResetEmail(E()); err('أُرسل رابط إعادة التعيين إلى بريدك'); });
    document.getElementById('lf-pass').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('lf-login').click();});
    function msg(e){ const c=(e&&e.code)||''; return c.includes('wrong-password')||c.includes('invalid-cred')?'بريد أو كلمة مرور غير صحيحة':c.includes('user-not-found')?'لا يوجد حساب بهذا البريد — أنشئ حساباً':c.includes('email-already')?'البريد مسجّل — سجّل الدخول':c.includes('invalid-email')?'بريد غير صحيح':(e.message||'خطأ'); }
  }
  function hideLogin(){ const o=document.getElementById('lf-ov'); if(o)o.remove(); }
  function banner(kind,text,dismiss){ let b=document.getElementById('lf-badge'); if(!b){ b=document.createElement('div'); b.id='lf-badge'; document.body.appendChild(b); } const col={ok:['#eafaef','#1f8a5b'],warn:['#fdf5e6','#b7791f'],bad:['#fdeceb','#c43c3c']}[kind]||['#eee','#333']; b.style.background=col[0]; b.style.color=col[1]; b.innerHTML=`<span style="flex:1">${text}</span>`; if(dismiss){ const x=document.createElement('span'); x.className='x'; x.textContent='✕'; x.onclick=()=>b.remove(); b.appendChild(x);} }
  function setupBtn(connected){ let b=document.getElementById('lf-badge'); if(!b)return; if(!connected){ const btn=document.createElement('button'); btn.textContent='ربط Firebase'; btn.onclick=openSetup; b.insertBefore(btn,b.firstChild); } else { const btn=document.createElement('button'); btn.textContent='خروج'; btn.onclick=()=>{ try{firebase.auth().signOut();}catch(e){} }; b.appendChild(btn); } }
  function openSetup(){ const cur=(()=>{try{return localStorage.getItem('latifa_fb_cfg')||''}catch(e){return ''}})(); const v=prompt('الصق firebaseConfig كاملاً (JSON) من إعدادات مشروعك في Firebase:\n\nمثال:\n{"apiKey":"…","authDomain":"…","projectId":"…","appId":"…"}', cur); if(v==null)return; try{ const o=JSON.parse(v.replace(/^\s*const\s+firebaseConfig\s*=\s*/,'').replace(/;\s*$/,'')); if(!o.apiKey)throw 0; localStorage.setItem('latifa_fb_cfg',JSON.stringify(o)); const em=prompt('إيميلات المُلّاك (تفصلها فاصلة) — تُمنح صلاحية المالك:',''); if(em)localStorage.setItem('latifa_owner_emails',JSON.stringify(em.split(',').map(x=>x.trim()).filter(Boolean))); alert('تم الحفظ — سيُعاد تحميل الصفحة للاتصال.'); location.reload(); }catch(e){ alert('صيغة غير صحيحة — تأكد من نسخ الكائن كاملاً.'); } }
})();
</script>
<title>Latifa OS</title>
<meta name="description" content="نظام لطيفة التشغيلي — تحليل، تنبؤ، تتبّع وإجراءات على منهجية المثلث التشغيلي وشجرة المؤشرات">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#f5f1f4; --surface:#ffffff; --surface-2:#efe7ee; --surface-3:#faf7fa;
  --ink:#201622; --ink-2:#645768; --ink-3:#978a9b; --line:#e6dde7; --line-2:#d8cbda;
  --accent:#7a2b7d; --accent-2:#5b1d5f; --accent-soft:#f1e3f1; --accent-ink:#ffffff;
  --green:#7fae35; --green-soft:#edf4dc; --green-deep:#5c7f24;
  --good:#1f8a5b; --warn:#b7791f; --bad:#c43c3c; --crit:#b02a2a; --info:#2f63c4;
  --c1:#7a2b7d; --c2:#1f7f8a; --c3:#c9871c; --c4:#5b6b7a; --c5:#c4507a; --c6:#6e8b2e;
  --shadow:0 1px 2px rgba(60,30,60,.05),0 6px 20px rgba(60,30,60,.07);
  --shadow-lg:0 2px 8px rgba(60,30,60,.08),0 20px 48px rgba(60,30,60,.14);
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141019; --surface:#1c1721; --surface-2:#27202e; --surface-3:#211a27;
  --ink:#f3eff5; --ink-2:#b6a9ba; --ink-3:#84778c; --line:#322a3a; --line-2:#413648;
  --accent:#c77bc9; --accent-2:#dea3df; --accent-soft:#371f3a; --accent-ink:#1a0f1c;
  --green:#a8ce5a; --green-soft:#26301a; --green-deep:#c3df84;
  --good:#4cbd76; --warn:#e2a83a; --bad:#ea7472; --crit:#f26a66; --info:#7ea4ef;
  --c1:#c77bc9; --c2:#4fb8c4; --c3:#e0a548; --c4:#9aa9b8; --c5:#e57ba0; --c6:#a3c25a;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.4);
  --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 20px 48px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --bg:#141019; --surface:#1c1721; --surface-2:#27202e; --surface-3:#211a27;
  --ink:#f3eff5; --ink-2:#b6a9ba; --ink-3:#84778c; --line:#322a3a; --line-2:#413648;
  --accent:#c77bc9; --accent-2:#dea3df; --accent-soft:#371f3a; --accent-ink:#1a0f1c;
  --green:#a8ce5a; --green-soft:#26301a; --green-deep:#c3df84;
  --good:#4cbd76; --warn:#e2a83a; --bad:#ea7472; --crit:#f26a66; --info:#7ea4ef;
  --c1:#c77bc9; --c2:#4fb8c4; --c3:#e0a548; --c4:#9aa9b8; --c5:#e57ba0; --c6:#a3c25a;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.4);
  --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 20px 48px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Tajawal",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
:root{direction:rtl}:root[dir=ltr]{direction:ltr}:root[dir=rtl]{direction:rtl}
h1,h2,h3,.disp{font-family:"Tajawal","IBM Plex Sans Arabic",sans-serif}
[dir=ltr] h1,[dir=ltr] h2,[dir=ltr] h3,[dir=ltr] .disp{font-family:"Sora","Tajawal",sans-serif}
.num{font-variant-numeric:tabular-nums}

/* topbar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-family:"Tajawal";white-space:nowrap}
[dir=ltr] .brand{font-family:"Sora"}
.logo-badge{width:32px;height:32px;border-radius:8px;background:#fff;padding:3px;object-fit:contain;box-shadow:var(--shadow);border:1px solid var(--line);flex:none}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.conn .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.conn.live .dot{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.conn.off .dot{background:var(--warn)}
.spacer{flex:1 1 auto;min-width:0}
.langtog{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px;flex:none}
.langtog button{border:0;background:transparent;color:var(--ink-2);font-weight:800;font-size:12px;padding:5px 10px;border-radius:999px;cursor:pointer;font-family:inherit}
.langtog button.on{background:var(--accent);color:var(--accent-ink)}
.tabs{max-width:1280px;margin:0 auto;padding:0 18px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;color:var(--ink-2);font-weight:700;font-size:13.5px;padding:11px 14px;cursor:pointer;font-family:inherit;border-bottom:2.5px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tabs button .cnt{font-size:11px;font-weight:800;background:var(--surface-2);color:var(--ink-3);padding:1px 7px;border-radius:999px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button.on .cnt{background:var(--accent-soft);color:var(--accent)}

.wrap{max-width:1280px;margin:0 auto;padding:20px 18px 70px}
h2.pt{font-size:22px;font-weight:800;margin:0 0 2px}
.psub{color:var(--ink-2);font-size:13.5px;margin:0 0 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rowb{justify-content:space-between}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:13px;padding:8px 13px;border-radius:9px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:.12s}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}.btn.pri:hover{background:var(--accent-2)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.gh{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:11px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.kpi .kl{font-size:12px;color:var(--ink-2);font-weight:600}
.kpi .kv{font-family:"Tajawal";font-weight:800;font-size:24px;margin-top:4px;line-height:1.05}
[dir=ltr] .kpi .kv{font-family:"Sora"}
.kpi .kv small{font-size:12px;color:var(--ink-3);font-weight:700}
.kpi .ks{font-size:11px;color:var(--ink-3);margin-top:2px}
.kpi.hl{background:linear-gradient(150deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}
.kpi.hl .kl,.kpi.hl .ks{color:rgba(255,255,255,.85)}
.kpi.bad .kv{color:var(--bad)}.kpi.warn .kv{color:var(--warn)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h3{font-size:15px;font-weight:700;margin:0 0 12px}
.card h3 .hs{font-size:12px;color:var(--ink-3);font-weight:500}

/* tables */
.tw{overflow-x:auto;border-radius:var(--r-sm);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface)}
th,td{padding:9px 11px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{color:var(--ink-3);font-weight:600;font-size:11.5px;background:var(--surface-3);position:sticky;top:0;z-index:1}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface-3)}
td.wrap-c{white-space:normal;max-width:340px;min-width:200px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800}
.chip.done{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.chip.progress{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.chip.notstarted{background:var(--surface-2);color:var(--ink-3)}
.chip.over{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.chip.active{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.chip.watch{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.chip.risk{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
select.inline,input.inline{font-family:inherit;font-size:12.5px;padding:4px 7px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);max-width:150px}
.mini{display:inline-block;width:60px;height:6px;border-radius:3px;background:var(--surface-2);vertical-align:middle;margin-inline-start:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* progress rails (dashboard) */
.rail{display:flex;flex-direction:column;gap:10px}
.rr .rt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.rr .rn{font-weight:700;display:flex;align-items:center;gap:7px}
.rag{width:9px;height:9px;border-radius:50%;flex:none}
.rr .rk{height:9px;background:var(--surface-2);border-radius:5px;overflow:hidden;margin-top:4px;width:auto}
.rr .rf{height:100%;border-radius:5px}
.hb{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.hb .hbt{display:flex;justify-content:space-between;font-size:12.5px}
.hb .hbl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hb .hbv{font-weight:800;color:var(--ink-2);flex:none}
.hb .hbk{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hb .hbf{height:100%;border-radius:4px;background:var(--accent)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(30,15,35,.5);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-lg);width:min(520px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:17px;font-weight:800}
.modal-b{padding:18px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
.fld textarea{min-height:70px;resize:vertical}
.modal-f{display:flex;gap:9px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line)}

.ins{border-inline-start:3px solid var(--accent);border-radius:var(--r-sm);padding:12px 14px;background:var(--surface-3);font-size:13px;color:var(--ink-2)}
.ins.crit{border-inline-start-color:var(--crit)}.ins b{color:var(--ink)}
.empty{text-align:center;padding:40px 20px;color:var(--ink-3)}
.toast{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== v20 design upgrade ===== */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.tabs button{padding:9px 12px;font-size:13px}
h2.pt{font-size:24px;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.kpi{position:relative;overflow:hidden;padding:13px 14px 12px}
.kpi .kv{font-size:23px}
.kpi .kd{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;margin-top:5px;background:var(--surface-2);color:var(--ink-2)}
.kpi .kd.up{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.kpi .kd.down{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.kpi.hl .kd{background:rgba(255,255,255,.18);color:#fff}
.kpi .spark{position:absolute;left:10px;bottom:8px;width:84px;height:30px;opacity:.9}
[dir=ltr] .kpi .spark{left:auto;right:10px}
.kpi .kd{max-width:calc(100% - 100px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi.good{border-color:color-mix(in srgb,var(--good) 35%,var(--line))}
.kpi.bad{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.kpi.warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.card{padding:16px 18px}
.card h3{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:15px}
.card h3 .hs{font-weight:500}
.card h4{font-size:13px;color:var(--ink-2);font-weight:700;margin:8px 0 6px}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-3) 60%,transparent)}
tbody tr:hover{background:var(--accent-soft)}
th{letter-spacing:.02em}
td.n,th.n{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif}
.ins{line-height:1.6}
.ins.warn{border-inline-start-color:var(--warn)}.ins.good{border-inline-start-color:var(--good)}.ins.bad{border-inline-start-color:var(--bad)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:980px){.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.grid3{grid-template-columns:1fr}}
/* insights */
.insight{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.insight:last-child{border-bottom:0}
.insight .sev{width:10px;height:10px;border-radius:50%;margin-top:6px}
.insight .ttl{font-weight:700;font-size:13.5px}
.insight .why{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.insight .act{font-size:12.5px;color:var(--ink);margin-top:4px}
.insight .act b{color:var(--accent)}
.insight .kwd{font-family:"Tajawal";font-weight:800;font-size:16px;white-space:nowrap;text-align:end}
.insight .kwd small{display:block;font-size:10.5px;color:var(--ink-3);font-weight:600}
.insight .go{font-size:11.5px;color:var(--accent);cursor:pointer;font-weight:700}
/* segmented control */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink-2);font-weight:700;font-size:12.5px;padding:6px 11px;border-radius:8px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
/* report */
.rep-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:18px 20px;border-radius:var(--r);background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;margin-bottom:14px}
.rep-h h2{margin:0;font-size:22px;color:#fff}
.rep-h .sub{opacity:.85;font-size:13px}
.rep-h .big{font-family:"Tajawal";font-size:34px;font-weight:900;line-height:1}
.narr{font-size:14px;line-height:1.85;max-width:72ch}
.narr b{color:var(--accent)}
.fresh{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.fresh .fi{padding:9px 11px;border-radius:10px;background:var(--surface-3);border:1px solid var(--line);font-size:12px}
.fresh .fi b{display:block;font-size:12.5px}
.fresh .fi.stale{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 8%,var(--surface-3))}
.fresh .fi.dead{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--surface-3))}
@media print{.top,.tabs,#groups,.btn,.langtog,.conn,.toast,#modal-root{display:none!important}body{background:#fff;color:#000}.card,.kpi{box-shadow:none;border:1px solid #ccc;break-inside:avoid}.wrap{padding:0;max-width:none}.rep-h{color:#000;background:#eee}.rep-h h2{color:#000}}

/* ---- v2 additions ---- */
.groups{display:flex;gap:6px;padding:8px 18px 0;overflow-x:auto;scrollbar-width:none}
.groups button{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 14px;font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap;font-family:inherit}
.groups button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tree{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:820px){.tree{grid-template-columns:1fr}}
.tree .lvl{background:var(--surface-2);border-radius:12px;padding:12px}
.tree .lvl h4{margin:0 0 8px;font-size:12px;color:var(--ink-3);letter-spacing:.3px}
.tree .it{display:flex;justify-content:space-between;align-items:center;padding:7px 8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;margin-bottom:6px;font-size:12.5px}
.tree .it b{font-family:'Sora',sans-serif;font-size:13px}
.sig{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
.alerts .al{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);margin-bottom:8px;font-size:13px}
.alerts .al .ic{font-size:18px;line-height:1}
.alerts .al.crit{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 7%,var(--surface))}
.alerts .al.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
.alerts .al.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--surface))}
.bench{font-size:11px;color:var(--ink-3)}
.gauge{position:relative;height:10px;background:var(--surface-2);border-radius:6px;overflow:visible;margin:6px 0 2px}
.gauge .ok{position:absolute;top:0;height:100%;background:color-mix(in srgb,var(--good) 35%,transparent);border-radius:6px}
.gauge .pin{position:absolute;top:-3px;width:4px;height:16px;border-radius:2px;background:var(--ink-1);transform:translateX(-50%)}
.gauge .pin.bad{background:var(--bad)} .gauge .pin.good{background:var(--good)}
.miss{border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn) 6%,var(--surface));border-radius:12px;padding:12px 14px;margin-bottom:12px}
.miss h4{margin:0 0 6px;font-size:13px}
.miss ul{margin:0;padding-inline-start:18px;font-size:12.5px;line-height:1.7}
.svgc{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
.role{font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-weight:800}
.role.owner{background:var(--accent);color:#fff}.role.manager{background:color-mix(in srgb,var(--good) 25%,var(--surface))}.role.cashier{background:color-mix(in srgb,var(--warn) 25%,var(--surface))}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--ink-3);font-size:13px;cursor:pointer}
.drop:hover{border-color:var(--accent)}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.matrix .q{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.matrix .q h4{margin:0 0 4px;font-size:14px}
.matrix .q .d{font-size:11.5px;color:var(--ink-3);margin-bottom:8px}
.matrix .q li{font-size:12px;line-height:1.6}
.matrix .q ul{margin:0;padding-inline-start:16px;max-height:140px;overflow:auto}
.chk{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;font-size:13px;background:var(--surface)}
.chk input{width:18px;height:18px}
.tabs button.grp{opacity:.45;pointer-events:none;font-size:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}@media(max-width:900px){.grid3{grid-template-columns:1fr}}
.sub{font-size:12px;color:var(--ink-3)}
.big{font-family:'Sora',sans-serif;font-weight:800;font-size:26px}

.stepper{display:flex;gap:8px;flex-wrap:wrap}

function salesRoll(){ const d=dailyTotal(); const l30=last(d,30), l7=last(d,7), p30=d.slice(Math.max(0,d.length-60),Math.max(0,d.length-30)); const r30=mean(l30.map(x=>x.net)), r7=mean(l7.map(x=>x.net)), rp=mean(p30.map(x=>x.net)); const plan=+S.config.planDaily||1200; return {r30,r7,rp,plan,attain:plan?Math.round(r30/plan*100):0,trend:rp?100*(r30-rp)/rp:0,days:d.length,lastDate:d.length?d[d.length-1].date:'',net30:sum(l30,x=>x.net),orders30:sum(l30,x=>x.orders)}; }

function cashRoll(){ const all=S.cash; const nc=all.filter(isNoCount); const c=all.filter(x=>!isNoCount(x)); const ncBy={}; nc.forEach(x=>{const e=x.emp||'—';(ncBy[e]=ncBy[e]||{k:e,n:0,cash:0,branch:x.branch});ncBy[e].n++;ncBy[e].cash+=(+x.expected||0)-(+x.opening||0);}); const net=sum(c,x=>+x.variance||0); const byE={}, byB={}; c.forEach(x=>{ const e=x.emp||'—'; (byE[e]=byE[e]||{k:e,n:0,net:0}); byE[e].n++; byE[e].net+=+x.variance||0; const b=x.branch||'—'; (byB[b]=byB[b]||{k:b,n:0,net:0}); byB[b].n++; byB[b].net+=+x.variance||0; }); const emps=Object.values(byE).map(o=>({...o,avg:o.net/o.n})).sort((a,b)=>a.net-b.net); const brs=Object.values(byB).map(o=>({...o,avg:o.net/o.n})).sort((a,b)=>a.net-b.net); return {net,n:c.length,nAll:all.length,nNoCount:nc.length,noCount:Object.values(ncBy).sort((a,b)=>b.n-a.n),nShort:c.filter(x=>(+x.variance||0)<0).length,short:sum(c.filter(x=>(+x.variance||0)<0),x=>+x.variance),emps,brs,labor:sum(all,x=>+x.labor||0)}; }
function goalRoll(){ const g={}; S.tasks.forEach(x=>{const k=x.goal||'—';(g[k]=g[k]||{goal:k,goalEn:x.goalEn||k,n:0,sum:0,done:0,over:0});g[k].n++;g[k].sum+=x.status==='done'?100:x.status==='progress'?50:0;if(x.status==='done')g[k].done++;if(x.due&&x.due<TODAY&&x.status!=='done')g[k].over++;}); return Object.values(g).map(o=>({...o,pct:o.n?Math.round(o.sum/o.n):0})).sort((a,b)=>b.n-a.n); }
function wasteRoll(){ const w=S.waste; const l30=w.filter(x=>x.date>=addDays(TODAY,-30)); const byC={}; l30.forEach(x=>{byC[x.cause]=(byC[x.cause]||0)+(+x.value||0)}); return {n:l30.length,value:sum(l30,x=>+x.value||0),byC}; }
function addDays(s,n){ const d=new Date(s); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
/* Early-warning signals (reference §4-10) — each returns {lvl:'crit'|'warn'|'good', ar, en} */
function signals(){
 const out=[]; const F=finRoll(), sr=salesRoll(), cr=cashRoll(), I=S.inventory, C=S.customers, fin=S.finance||{};
 const push=(lvl,ar,en,tab)=>out.push({lvl,ar,en,tab});
 if(F.prime!=null){ if(F.prime>65)push('crit',`Prime Cost ${pct(F.prime)} — تجاوز ٦٥٪: راجع الحصص/الأسعار/جدولة العمالة فوراً.`,`Prime Cost ${pct(F.prime)} > 65% — review portions/prices/labor now.`,'fin'); else if(F.prime>62)push('warn',`Prime Cost ${pct(F.prime)} قريب من الخط الأحمر (٦٥٪).`,`Prime Cost ${pct(F.prime)} near the 65% line.`,'fin'); else push('good',`Prime Cost ${pct(F.prime)} ضمن النطاق الصحي.`,`Prime Cost ${pct(F.prime)} healthy.`,'fin'); }
 else push('warn','Prime Cost غير محسوب — أدخل تكلفة العمالة الشهرية في «الإعدادات».','Prime Cost unknown — enter monthly labor cost in Settings.','settings');
 if(fin.cash_on_hand!=null&&F.rent+F.labor+F.opex>0){ const weekly=(F.cogsM+F.labor+F.rent+F.opex)/4.33; const wk=weekly?(+fin.cash_on_hand)/weekly:0; if(wk<8)push('crit',`النقد المتاح يغطي ${fmt(wk,1)} أسبوع فقط (< ٨): خفّض المخزون، سرّع التحصيل، تفاوض على السداد.`,`Cash covers ${fmt(wk,1)} weeks (< 8).`,'fin'); else push('good',`النقد المتاح يغطي ${fmt(wk,1)} أسبوع تشغيل.`,`Cash covers ${fmt(wk,1)} weeks.`,'fin'); }
 else push('warn','لا نعرف النقد المتاح — أدخل رصيد النقد/البنك لحساب أسابيع التشغيل.','Cash on hand unknown — enter it to compute runway.','settings');
 const v=I.variance_pct||0; if(v>2)push('crit',`فجوة فروقات المخزون ${pct(v)} (> ٢٪): جرد أعمى + تحقيق + صلاحيات.`,`Inventory variance ${pct(v)} (> 2%): blind count + investigate.`,'inv'); else push('good',`فروقات المخزون ${pct(v)} ضمن الحد.`,`Variance ${pct(v)} OK.`,'inv');
 if(I.milk_var&&Math.abs(I.milk_var.var_pct)>15)push('crit',`فجوة الحليب ${pct(Math.abs(I.milk_var.var_pct))} (> ١٥٪ = تبخير زائد/وصفة خاطئة): دوّن البارستا على الكمية القياسية وراجع وصفة الحليب في POS.`,`Milk variance ${pct(Math.abs(I.milk_var.var_pct))} (> 15%).`,'inv');
 if(cr.emps[0]&&cr.emps[0].net<-200)push('crit',`عجز صندوق مركّز: «${cr.emps[0].k}» ${kd(cr.emps[0].net,1)} على ${cr.emps[0].n} وردية.`,`Cash shortfall concentrated: "${cr.emps[0].k}" ${kd(cr.emps[0].net,1)}.`,'cash');
 if(sr.trend<-5)push('warn',`المبيعات آخر ٣٠ يوم أقل بـ ${pct(Math.abs(sr.trend))} من الـ٣٠ السابقة (${kd(sr.r30,0)}/يوم).`,`Sales down ${pct(Math.abs(sr.trend))} vs prior 30 days.`,'sales'); else if(sr.trend>5)push('good',`المبيعات صاعدة ${pct(sr.trend)} مقابل الـ٣٠ يوم السابقة.`,`Sales up ${pct(sr.trend)}.`,'sales');
 if(sr.attain<70)push('warn',`تحقيق الهدف ${pct(sr.attain)} فقط (${kd(sr.r30,0)} من ${kd(sr.plan,0)}/يوم).`,`Attainment ${pct(sr.attain)}.`,'sales');
 if(C.segments){ const lost=C.segments.lost||0, tot=C.with_orders||1; const lp=100*lost/tot; if(lp>40)push('crit',`${pct(lp)} من العملاء مفقودون (> ١٨٠ يوم بلا طلب) و${C.segments.at_risk||0} في خطر: أطلق قائمة إنقاذ وعرضاً مستهدفاً.`,`${pct(lp)} of customers lost; ${C.segments.at_risk||0} at risk.`,'cust'); }
 const over=S.tasks.filter(x=>x.due&&x.due<TODAY&&x.status!=='done').length; if(over>10)push('warn',`${over} مهمة متأخّرة في الخطة.`,`${over} overdue plan tasks.`,'plan');
 const esc=S.incidents.filter(x=>x.escalated).length; if(esc>0)push('warn',`${esc} بلاغ مُصعّد للمالك بانتظار قرار.`,`${esc} incidents escalated.`,'inc');
 const cs=S.cashagg.splh||{}; const sp=Object.values(cs).map(x=>x.splh).filter(Boolean); if(sp.length&&mean(sp)<18)push('warn',`إنتاجية العمالة ${fmt(mean(sp),1)} د.ك/ساعة (المرجع ٢٠–٢٥): جدوِل العمالة على منحنى الذروة.`,`SPLH ${fmt(mean(sp),1)} KWD/hr (target 20–25).`,'ops');
 const rank={crit:0,warn:1,good:2}; return out.sort((a,b)=>rank[a.lvl]-rank[b.lvl]);
}

function missing(){

 const extra=[{ar:'وقت الخدمة الحقيقي (من الطلب للتسليم) — بيانات KDS أو قياس يدوي لأسبوع في الذروة','en':'Real service time (KDS)','why':'وقت الكاشير في فودكس (٠٫٣–١٫٥ دقيقة) لا يعكس زمن التحضير','tab':'ops'},{ar:'سجل الهدر اليومي بالسبب (تلف/تحضير زائد/خطأ/مرتجع)','en':'Daily waste log','why':'ابدأ التسجيل من تبويب «الهدر» — يكشف نقطة العلاج','tab':'waste'},{ar:'حرارة الثلاجات/الفريزر مرتين يومياً (HACCP)','en':'HACCP temps','why':'تأمين على الإيراد كله — سجّل من تبويب «السلامة»','tab':'haccp'}];
 return {fields:m,extra};
}

 card(v,T('آخر ٦٠ يوماً + توقّع ٣٠ يوماً','Last 60 days + 30-day forecast'),svgLine(last(ser,60),f.fc)+`<div class="legend"><span><i style="background:var(--accent)"></i>${T('فعلي','actual')}</span><span><i style="background:var(--accent);opacity:.3"></i>${T('نطاق ٨٠٪','80% interval')}</span><span><i style="background:var(--warn)"></i>${T('الهدف','plan')}</span></div>`);
 card(v,T('مقارنة النماذج','Model comparison'),`<div class="tw"><table><thead><tr><th>${T('النموذج','Model')}</th><th class="n">MASE</th><th>${T('القراءة','Read')}</th></tr></thead><tbody>${f.cands.map(c=>`<tr><td>${esc(c.name)}</td><td class="n num">${fmt(c.mase,3)}</td><td class="sub">${c.mase<0.8?T('دقيق — اعتمده للشراء والعمالة','accurate'):c.mase<1?T('مقبول','acceptable'):T('لا يتفوّق على الساذج','no better than naive')}</td></tr>`).join('')}</tbody></table></div>`,T('MASE < ١ = أفضل من التنبؤ الساذج','MASE < 1 beats naive'));

 const purchase=f.sum*(S.sales.food_cost_pct||30)/100; g.appendChild(el('div','card',`<h3>${T('ربط التنبؤ بالشراء والعمالة','Forecast → purchasing & labor')}</h3><div class="tw"><table><tbody><tr><td>${T('مشتريات متوقعة (٣٠ يوم)','Expected purchases')}</td><td class="n num">${kd(purchase,0)}</td></tr><tr><td>${T('حصة شبرة المتوقعة','Expected top-supplier spend')}</td><td class="n num">${kd(purchase*(S.inventory.top_share||40)/100,0)}</td></tr><tr><td>${T('ساعات عمل مقترحة (SPLH هدف ٢٠)','Labor hours @ SPLH 20')}</td><td class="n num">${fmt(f.sum/20)}</td></tr><tr><td>${T('أفضل يوم متوقع','Peak day')}</td><td class="n num">${(()=>{const b=f.fc.reduce((a,x)=>x.y>a.y?x:a);return b.date+' · '+fmt(b.y)})()}</td></tr></tbody></table></div><p class="sub">${T('التنبؤ الأدق يقلّص الشراء الزائد ومن ثمّ الهدر — رابط مباشر بين المبيعات والمخزون.','Better forecast → less over-buying → less waste.')}</p>`)); v.appendChild(g);

 card(v,T('توافق التنبؤ (S&OP) وسجل الدقة','S&OP consensus & accuracy log'),`<p class="sub" style="margin:0 0 8px">${T('التنبؤ الإحصائي + تعديل الفريق (حملة، عطلة، طقس) = رقم واحد للشراء والعمالة. احفظ لقطة شهرية وقارنها بالفعلي لاحقاً (Forecast Value Added).','Statistical forecast + team adjustment = one number. Snapshot monthly and compare.')}</p><div class="row" style="gap:12px;flex-wrap:wrap;align-items:center"><span>${T('تعديل الفريق','Team override')}: <b class="num">${ov>=0?'+':''}${ov}%</b></span><span>${T('التنبؤ المعتمد ٣٠ يوم','Consensus 30d')}: <b class="num">${kd(adj,0)}</b></span>${canDo('finance')?`<button class="btn sm" onclick="modal(T('تعديل الفريق','Override'),[{k:'fc_override',l:T('نسبة التعديل ٪ (+/−)','Override %'),type:'number',def:ov},{k:'fc_reason',l:T('السبب','Reason'),def:(S.finance||{}).fc_reason||''}],async d=>{S.finance={...S.finance,fc_override:+d.fc_override||0,fc_reason:d.fc_reason};await dbSet('meta/finance',S.finance);render();})">✎ ${T('تعديل','Override')}</button><button class="btn pri sm" onclick="fcLog()">📌 ${T('حفظ لقطة','Snapshot')}</button>`:''}</div>${(S.finance||{}).fc_reason?`<p class="sub">${T('السبب','Reason')}: ${esc(S.finance.fc_reason)}</p>`:''}${S.fclog.length?`<div class="tw" style="margin-top:8px"><table><thead><tr><th>${T('التاريخ','Date')}</th><th>${T('النموذج','Model')}</th><th class="n">MASE</th><th class="n">${T('توقّع ٣٠ يوم','30d')}</th><th class="n">${T('الفعلي بعده','Actual after')}</th><th class="n">${T('الخطأ','Error')}</th></tr></thead><tbody>${[...S.fclog].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,12).map(x=>{const act=sum(dailyTotal().filter(d=>d.date>x.date&&d.date<=addDays(x.date,30)),d=>d.net);const full=dailyTotal().filter(d=>d.date>x.date&&d.date<=addDays(x.date,30)).length>=28;return `<tr><td class="num">${x.date}</td><td class="sub">${esc(x.model)}</td><td class="n num">${fmt(x.mase,2)}</td><td class="n num">${fmt(x.sum30)}</td><td class="n num">${full?fmt(act):'<span c  const cats=M.cats||[]; card(v,T('الفئات','Categories'),cats.map(c=>hb(`${esc(c.cat)} <span class="sub">${pct(c.margin)}</span>`,c.net,kd(c.net,0),cats[0].net,c.margin>=70?'var(--good)':c.margin>=55?'var(--accent)':'var(--warn)')).join(''));
 const fb=el('div','row'); fb.style.margin='0 0 8px'; const fs=el('select','inline',[['',T('كل المنتجات','All')],['star',T('نجوم','Stars')],['plow',T('أحصنة','Plow')],['puzzle',T('ألغاز','Puzzles')],['dog',T('كلاب','Dogs')],['reprice',T('إعادة تسعير','Reprice')]].map(([k,l])=>`<option value="${k}" ${menuF===k?'selected':''}>${l}</option>`).join('')); fs.onchange=e=>{menuF=e.target.value;render()}; fb.appendChild(fs); v.appendChild(fb);

<script>
/* ================= INVENTORY / ACIR ================= */
function renderInv(v){
 const I=S.inventory; const sups=I.suppliers||[];
 head(v,T('المخزون و ACIR','Inventory · ACIR'),T('الفعلي مقابل النظري — الانحراف > ١٫٥–٢٪ = تحقيق فوري + جرد أعمى','Actual vs theoretical — variance > 1.5–2% = investigate + blind count'),{exportFn:()=>exportCSV('inventory_items',I.item_variance||[])});
 const vp=I.variance_pct||0;

 const eq=el('div','card',`<h3>${T('معادلة المطابقة (ACIR · R)','Reconciliation equation')}</h3><div class="tw"><table><tbody><tr><td>${T('الاستهلاك النظري (من فواتير الكاشير × الوصفات)','Theoretical consumption')}</td><td class="n num">${kd(I.theoretical,0)}</td></tr><tr><td>${T('تسويات الجرد (فعلي − نظري)','Count adjustments')}</td><td class="n num" style="color:var(--bad)">${kd(I.count_adj,0)}</td></tr><tr><td>${T('هدر موثّق','Documented waste')}</td><td class="n num">${kd(I.waste,0)}</td></tr><tr><td style="font-weight:800">${T('الانحراف','Variance')}</td><td class="n num" style="font-weight:800;color:${vp>2?'var(--bad)':'var(--good)'}">${pct(vp)} ${vp>2?'⚠':'✓'}</td></tr></tbody></table></div><p class="sub">${T('الأسباب الأربعة فقط: حصص غير منضبطة · هدر تحضير · سرقة/فاقد · أخطاء وصفة/إدخال. الهدر الموثّق ('+kd(I.waste,0)+') أقل بكثير من التسويات — معظم الفقد غير مسجّل: ابدأ سجل الهدر.','Only 4 causes: portions, prep waste, theft, recipe/entry errors.')}</p>`); v.appendChild(eq);
 const g=el('div','grid2');
 const iv=I.item_variance||[]; g.appendChild(el('div','card',`<h3>${T('أكبر الفروقات حسب الصنف','Largest item variances')} <span class="hs">${T('تسوية الجرد ÷ الاستهلاك','adj ÷ consumption')}</span></h3><div class="tw"><table><thead><tr><th>${T('الصنف','Item')}</th><th class="n">${T('استهلاك','Use')}</th><th class="n">${T('تسوية','Adj')}</th><th class="n">%</th></tr></thead><tbody>${iv.map(x=>`<tr><td style="font-size:12px">${esc(x.name)}</td><td class="n">${fmt(x.cons)}</td><td class="n num" style="color:${x.adj<0?'var(--bad)':'var(--warn)'}">${fmt(x.adj)}</td><td class="n num" style="font-weight:700">${fmt(x.var_pct,1)}%</td></tr>`).join('')}</tbody></table></div>`));
 const mv=I.milk_var, bv=I.beans_var; g.appendChild(el('div','card',`<h3>${T('فروقات الحليب والبُن (مقاهي)','Milk & bean variance (cafés)')}</h3>${mv?`<div class="kpi ${Math.abs(mv.var_pct)>15?'bad':'good'}" style="margin-bottom:8px"><div class="kl">${T('فجوة الحليب','Milk gap')}</div><div class="kv num">${pct(Math.abs(mv.var_pct))}</div><div class="ks">${T('المقبول < ١٠٪ · > ١٥٪ = تبخير زائد أو وصفة خاطئة','ok < 10%')}</div></div>`:''}${bv?`<div class="kpi ${Math.abs(bv.var_pct)>10?'warn':'good'}"><div class="kl">${T('فجوة البُن','Bean gap')}</div><div class="kv num">${pct(Math.abs(bv.var_pct))}</div><div class="ks">${T('كل ١٨غ جرعة — راقب الكرم مع الأصدقاء','18g/shot')}</div></div>`:''}<p class="sub" style="margin-top:8px">${T('العلاج: أباريق مدرّجة، تدريب على الكمية القياسية، قياس أسبوعي، ومراجعة وصفة الحليب في فودكس (إشارة فجوة موجبة = الوصفة تخصم أكثر من الواقع).','Fix: measured jugs, standard dose training, weekly check, verify POS recipe.')}</p>`)); v.appendChild(g);
 const ds=(I.dead_stock||{}).items||[]; if(ds.length)card(v,T('المخزون الميت','Dead stock'),ds.map(x=>hb(esc(x.name),x.value,kd(x.value,0),ds[0].value,'var(--warn)')).join('')+`<p class="sub">${T('أوقف شراءها، صرّفها في عروض، واحذف أصناف «الكلاب» المرتبطة بها.','Stop buying, clear via offers, delete related dog items.')}</p>`,T('كما في ','as of ')+(I.dead_stock||{}).as_of);
 card(v,T('ضوابط ACIR — قائمة التحقق','ACIR controls checklist'),['A · ترميز الأصول (QR) وصيانة وقائية مجدولة للماكينات/الثلاجات','C · لا إلغاء (Void) بلا رقم مشرف · لا مفتاح مخزن للباريستا · حصص قياسية بالميزان','I · FIFO/FEFO · حدود Par (حد أدنى/أقصى) لكل مادة طازجة','R · مطابقة أسبوعية بالمعادلة · جرد أعمى (بلا رؤية أرقام النظام) · تحقيق فوري > ٢٪'].map(x=>`<div class="chk"><input type="checkbox" onchange="this.parentNode.style.opacity=this.checked?.5:1"><span>${x}</span></div>`).join(''));
 const bt=I.by_type||{}; card(v,T('حركات المخزون حسب النوع','Ledger by transaction type'),`<div class="tw"><table><thead><tr><th>${T('النوع','Type')}</th><th class="n">${T('عدد','Count')}</th><th class="n">${T('القيمة','Value')}</th></tr></thead><tbody>${Object.entries(bt).sort((a,b)=>b[1].cost-a[1].cost).map(([k,o])=>`<tr><td style="font-size:12px">${esc(k)}</td><td class="n">${fmt(o.n)}</td><td class="n num" style="color:${o.cost<0?'var(--bad)':'inherit'}">${kd(o.cost,0)}</td></tr>`).join('')}</tbody></table></div>`,I.period);
}
/* ================= SUPPLIERS & PURCHASES ================= */
function renderSup(v){
 const I=S.inventory; const sups=I.suppliers||[]; const bal=sum(S.suppliers,x=>+x.balance||0);
 head(v,T('الموردون والمشتريات','Suppliers & Purchases'),T('تركّز التوريد، الأرصدة المستحقة، وسجل الفواتير','Concentration, balances, invoices'),{addFn:()=>purchForm(),addLabel:T('فاتورة شراء','Purchase invoice'),perm:'purch',exportFn:()=>exportCSV('purchases',S.purchases)});
 kpis(v,[{c:'',l:T('إجمالي الشراء (فودكس)','Purchases (Foodics)'),v:kd(I.purchase_total,0),s:I.period},{c:'bad',l:T('تركّز المورّد الأول','Top supplier share'),v:pct(I.top_share),s:esc(I.top_supplier)+T(' · الحد الآمن < ٣٠٪',' · safe < 30%')},{c:bal>0?'warn':'',l:T('أرصدة مستحقة للموردين','Payables'),v:kd((S.finance||{}).payables||bal,0),s:`${S.suppliers.length} ${T('مورّد','suppliers')}`},{c:'',l:T('فواتير مسجّلة يدوياً','Manual invoices'),v:fmt(S.purchases.length),s:kd(sum(S.purchases,x=>+x.value||0),0)}]);
 v.appendChild(el('div','ins crit',`<b>⚠ ${T('خطر المورّد الأوحد:','Single-supplier risk:')}</b> ${T(`${esc(I.top_supplier)} = ${pct(I.top_share)} من المشتريات (فواكه طازجة سريعة التلف). إجراء: مورّد بديل معتمد لأهم ٥ أصناف (رمان، أفوكادو، فراولة، برتقال، أناناس) + ثلاثة عروض للمشتريات الكبيرة + مطابقة (طلب ↔ استلام ↔ فاتورة).`,`${esc(I.top_supplier)} = ${pct(I.top_share)} of purchases. Secure a backup supplier for the top 5 items.`)}`));
 const g=el('div','grid2');
 g.appendChild(el('div','card',`<h3>${T('الموردون حسب قيمة الشراء','By purchase value')}</h3>`+sups.map(s=>hb(esc(s.name),s.cost,`${kd(s.cost,0)} · ${pct(s.pct)}`,sups[0].cost,s.pct>=25?'var(--bad)':s.pct>=10?'var(--warn)':'var(--accent)')).join('')));
 const items=I.items||[]; g.appendChild(el('div','card',`<h3>${T('أعلى الأصناف شراءً','Top purchased items')} <span class="hs">${T('أغلبها فواكه — سعّر على Yield','mostly fruit — price on yield')}</span></h3>`+items.map(x=>hb(esc(x.name),x.cost,kd(x.cost,0),items[0].cost)).join(''))); v.appendChild(g);
 const rows=[...S.suppliers].sort((a,b)=>(b.spend||0)-(a.spend||0));
 const tw=el('div','tw'); tw.innerHTML=`<table><thead><tr><th>${T('المورّد','Supplier')}</th><th class="n">${T('الإنفاق','Spend')}</th><th class="n">${T('الرصيد','Balance')}</th><th>${T('الحالة','Status')}</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td style="font-weight:600">${esc(x.name)}</td><td class="n num">${kd(x.spend||0,0)}</td><td class="n num" style="color:${(+x.balance||0)>0?'var(--warn)':'inherit'}">${kd(x.balance||0,0)}</td><td>${canDo('sup')?`<select class="inline" onchange="dbUpd('suppliers','${x.id}',{status:this.value})"><option value="active" ${(x.status||'active')==='active'?'selected':''}>${T('نشط','Active')}</option><option value="watch" ${x.status==='watch'?'selected':''}>${T('مراقبة','Watch')}</option><option value="risk" ${x.status==='risk'?'selected':''}>${T('خطر','Risk')}</option></select>`:`<span class="chip ${x.status||'active'}">${x.status||'active'}</span>`}</td><td>${canDo('sup')?`<button class="btn gh sm" onclick="supForm('${x.id}')">✎</button>`:''}</td></tr>`).join('')}</tbody></table>`; card(v,T('سجل الموردين','Supplier register'),tw);
 if(S.purchases.length){ const tw2=el('div','tw'); tw2.innerHTML=`<table><thead><tr><th>${T('التاريخ','Date')}</th><th>${T('المورّد','Supplier')}</th><th>${T('الصنف','Item')}</th><th class="n">${T('القيمة','Value')}</th><th>${T('مطابقة','Matched')}</th><th></th></tr></thead><tbody>${[...S.purchases].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,50).map(x=>`<tr><td class="num">${esc(x.date)}</td><td>${esc(x.supplier)}</td><td>${esc(x.item)}</td><td class="n num">${kd(x.value,1)}</td><td>${x.matched?'✓':'—'}</td><td>${canDo('purch')?`<button class="btn gh sm" onclick="purchForm('${x.id}')">✎</button><button class="btn gh sm" onclick="delRec('purchases','${x.id}')">🗑</button>`:''}</td></tr>`).join('')}</tbody></table>`; card(v,T('فواتير الشراء','Purchase invoices'),tw2); }
}
function supForm(id){ const rec=id?S.suppliers.find(x=>x.id===id):null; modal(id?T('تعديل مورّد','Edit supplier'):T('مورّد جديد','New supplier'),[{k:'name',l:T('الاسم','Name'),def:rec?rec.name:''},{k:'balance',l:T('الرصيد المستحق','Balance due'),type:'number',def:rec?rec.balance:0},{k:'terms',l:T('شروط السداد (أيام)','Payment terms (days)'),type:'number',def:rec?rec.terms:0},{k:'note',l:T('ملاحظة','Note'),type:'textarea',def:rec?rec.note:''}],d=>{ if(id)dbUpd('suppliers',id,d); else dbAdd('suppliers',{...d,spend:0,status:'active'}); toast(T('تم الحفظ','Saved')); }); }

let cashF='';
function renderCash(v){

function parseCSV(txt){ const rows=[]; let row=[],cell='',q=false; for(let i=0;i<txt.length;i++){ const ch=txt[i]; if(q){ if(ch==='"'){ if(txt[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; } else { if(ch==='"')q=true; else if(ch===','){row.push(cell);cell='';} else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&txt[i+1]==='\n')i++; row.push(cell);cell='';if(row.some(c=>c!==''))rows.push(row);row=[]; } else cell+=ch; } } if(cell!==''||row.length){row.push(cell);rows.push(row);} return rows; }

 head(v,T('السيناريوهات والتعادل','Scenarios & Break-even'),T('متشائم / أساسي / متفائل — كم يبقى من الربح لو تغيّرت المبيعات أو التكاليف','Pessimistic / base / optimistic'));

 const calc=(ds,dc,dl)=>{ const net=base.net*(1+ds/100); const cogs=base.cogs*(1+ds/100)*(1+dc/100); const labor=base.labor*(1+dl/100); const np=net-cogs-labor-base.rent-base.opex-base.comm*(1+ds/100); const fixed=labor+base.rent+base.opex; const varr=(cogs+base.comm*(1+ds/100))/net; const be=fixed/(1-varr); return {net,cogs,labor,np,npPct:100*np/net,prime:100*(cogs+labor)/net,be,beDay:be/30,safety:100*(net-be)/net}; };

function renderRisk(v){

 head(v,T('سجل المخاطر (FMEA)','Risk Register (FMEA)'),T('RPN = الشدّة × الاحتمال × صعوبة الاكتشاف (١–١٠ لكلٍّ) — > ١٠٠ أولوية قصوى','RPN = S × L × D — > 100 top priority'),{addFn:()=>riskForm(),addLabel:T('خطر','Risk'),perm:'plan',exportFn:()=>exportCSV('risks',risks)});
 const rp=r=>(+r.sev||1)*(+r.lik||1)*(+r.det||1); const sorted=[...risks].sort((a,b)=>rp(b)-rp(a));
 kpis(v,[{c:'bad',l:T('أولوية قصوى (RPN > ١٠٠)','Top priority'),v:fmt(sorted.filter(r=>rp(r)>100).length)},{c:'warn',l:T('متوسطة (٥٠–١٠٠)','Medium'),v:fmt(sorted.filter(r=>rp(r)>50&&rp(r)<=100).length)},{c:'',l:T('الإجمالي','Total'),v:fmt(sorted.length)},{c:'',l:T('أعلى خطر','Highest'),v:sorted[0]?rp(sorted[0]):'—',s:sorted[0]?esc(sorted[0].area):''}]);
 if(risks[0]&&risks[0].seed&&canDo('plan'))v.appendChild(el('div','ins',`${T('هذه المخاطر مقترحة من التحليل والمرجع — ','Suggested from analysis — ')}<button class="btn pri sm" onclick="adoptRisks()">${T('اعتمدها لتصبح قابلة للتعديل','Adopt to edit')}</button>`));
 const tw=el('div','tw'); tw.innerHTML=`<table><thead><tr><th>${T('الخطر','Risk')}</th><th>${T('المجال','Area')}</th><th class="n">S</th><th class="n">L</th><th class="n">D</th><th class="n">RPN</th><th>${T('التخفيف','Mitigation')}</th><th>${T('المسؤول','Owner')}</th><th></th></tr></thead><tbody>${sorted.map(r=>{const x=rp(r);return `<tr><td class="wrap-c" style="font-weight:600;font-size:12.5px">${esc(r.risk)}</td><td class="sub">${esc(r.area)}</td><td class="n">${r.sev}</td><td class="n">${r.lik}</td><td class="n">${r.det}</td><td class="n num" style="font-weight:800;color:${x>100?'var(--bad)':x>50?'var(--warn)':'var(--good)'}">${x}</td><td class="wrap-c sub">${esc(r.mit)}</td><td class="sub">${esc(r.owner)}</td><td>${!r.seed&&canDo('plan')?`<button class="btn gh sm" onclick="riskForm('${r.id}')">✎</button><button class="btn gh sm" onclick="delRec('risks','${r.id}')">🗑</button>`:''}</td></tr>`}).join('')}</tbody></table>`; v.appendChild(tw);
 card(v,T('إنذارات المرجع المبكرة (راقبها أسبوعياً)','Reference early warnings'),`<div class="tw"><table><thead><tr><th>${T('الإنذار','Alert')}</th><th>${T('الإجراء الفوري','Immediate action')}</th></tr></thead><tbody>${[['النقد المتاح < ٨ أسابيع','خفض مخزون · تسريع تحصيل · تأجيل CAPEX · تفاوض سداد'],['Prime Cost > ٦٥٪ شهرين متتاليين','مراجعة حصص/أسعار/جدولة فوراً'],['تراجع تكرار الزبائن ٣ أسابيع','تحليل شكاوى + قائمة إنقاذ + مراجعة جودة'],['فجوة فروقات > ٢٪','جرد أعمى + تحقيق + صلاحيات'],['نفاد متكرر لصنف بطل','تصحيح التنبؤ وحدود Par ومخزون أمان']].map(([a,b])=>`<tr><td style="font-weight:600">${a}</td><td class="wrap-c sub">${b}</td></tr>`).join('')}</tbody></table></div>`);
}

const ISO=[['prep','١ · التحضير والالتزام','دعم القيادة · تعيين ممثل إدارة · فريق من الأقسام · تدريب أساسي على 2026'],['ctx','٢ · التخطيط والسياق','تحليل السياق (رقمي/مناخي/أخلاقي) · الأطراف المهتمة · سجل مخاطر وفرص (منفصلان)'],['doc','٣ · البناء والتوثيق','سياسة وأهداف جودة قابلة للقياس · خرائط عمليات · إجراءات ونماذج (SOPs)'],['run','٤ · التطبيق الفعلي','العمل بالنماذج والسجلات · جمع الأدلة على الالتزام (HACCP، الهدر، الشكاوى)'],['audit','٥ · التقييم الداخلي','تدقيق داخلي · مراجعة إدارة (أداء النظام ونسب تحقيق الأهداف)'],['cert','٦ · الشهادة الخارجية','SGS/TÜV/Intertek: مرحلة أولى (وثائق) ثم ثانية (ميداني) · صالحة ٣ سنوات']];

 card(v,T('الركائز الخمس في قطاع الخدمات','Five service pillars'),`<div class="stepper">${[['رحلة العميل و SLA','وثّق الخدمة من أول تواصل حتى الإتمام؛ زمن استجابة ودقة تنفيذ واضحة (وقت الخدمة ≤ ٧ د)'],['التحوّل الرقمي وأمن البيانات','أتمتة عبر POS/هذا النظام؛ حماية بيانات العملاء'],['الكفاءات والموردون','تدريب مستمر + معايير تقييم الموردين (تركّز < ٣٠٪)'],['رضا العملاء والشكاوى','قياس فوري بعد الخدمة + تحليل جذري (A3) لمنع التكرار'],['المعرفة المؤسسية','قاعدة معرفة حيّة (SOPs) تنقل الخبرة للجدد']].map(([t,d])=>`<div class="st"><b>${t}</b><span class="sub">${d}</span></div>`).join('')}</div>`);
 card(v,T('ما الجديد في 2026 مقابل 2015','What changed'),`<div class="tw"><table><tbody>${[['ثقافة الجودة والسلوك الأخلاقي','إلزام القيادة ببناء ثقافة جودة؛ أمانة الموظف وحماية بيانات العميل جزء من الجودة'],['فصل المخاطر عن الفرص','سجلان منفصلان — راجع تبويب المخاطر'],['اعتبارات المناخ','أثر انقطاع الكهرباء/الحرارة على سلسلة التبريد'],['المعرفة التنظيمية','قاعدة معرفة رقمية تحمي خبرة الموظف الخبير عند رحيله'],['الرقمنة والذكاء الاصطناعي','التحقق من صحة البيانات ودقة الأنظمة المستخدمة']].map(([a,b])=>`<tr><td style="font-weight:600">${a}</td><td class="wrap-c sub">${b}</td></tr>`).join('')}</tbody></table></div>`);

 ...DEPTS.map(d=>({k:'s_'+d[0],l:T('مبيعات · ','Sales · ')+T(d[1],d[2]),type:'number',def:g('s_'+d[0])})),

 {k:'laborCost',l:T('كلفة ساعات عمل اليوم (د.ك)','Labor cost today'),type:'number',def:g('laborCost')},{k:'laborHours',l:T('ساعات العمل','Labor hours'),type:'number',def:g('laborHours')},
 {k:'waste',l:T('التوالف (د.ك): فواكه/حليب/مرتجعات','Waste KWD'),type:'number',def:g('waste')},{k:'petty',l:T('المصاريف النثرية (د.ك)','Petty cash'),type:'number',def:g('petty')},{k:'receipts',l:T('فواتير النثرية مرفقة؟','Receipts attached?'),type:'select',opts:[{v:'1',l:T('نعم','Yes')},{v:'',l:T('لا','No')}],def:rec&&rec.receipts?'1':''},
 {k:'note',l:T('ملاحظات / أسباب الفرق','Notes'),type:'textarea',def:g('note')}],async d=>{ const st=sum(DEPTS,x=>+d['s_'+x[0]]||0), pt=sum(PAYS,x=>+d['p_'+x[0]]||0); d.salesTotal=Math.round(st*100)/100; d.payTotal=Math.round(pt*100)/100; d.matched=Math.abs(st-pt)<1; d.laborPct=st&&d.laborCost?Math.round(1000*d.laborCost/st)/10:null; d.receipts=d.receipts==='1'; await dbSet('closes/'+d.date+'_'+d.branch+(d.terminal?'_'+d.terminal.replace(/[^\w]/g,''):''),{...d,by:ME.id||null,byName:ME.name||'',at:new Date().toISOString()}); if(!d.matched)toast(T('⚠ الخزينة غير مطابقة — حقّق قبل الإقفال','Unmatched — investigate')); else toast(T('تم الإقفال ✓','Closed')); /* also push to daily if no live row */ if(st>0){ const k=d.date+'_'+d.branch; if(!S.dailyLive.find(x=>x.id===k)&&!S.daily.find(x=>x.id===k)) await dbSet('daily/'+k,{date:d.date,branch:d.branch,net:st,orders:0,cost:0,profit:0,labor:+d.laborHours||0,src:'close'}); } }); }

/* ================= P&L TYPES (multi-step · segmented) — appended to Financial ================= */
function renderPLTypes(v){
 const F=finRoll(); const fin=S.finance||{}; const d=dailyTotal(); const l30=last(d,30); const days=l30.length||1; const k=30/days;
 const byBr={}; BRS.forEach(b=>{ const s=last(dailyTotal(b),30); byBr[b]={net:sum(s,x=>x.net)*k,cogs:sum(s,x=>x.cost)*k}; });
 const totNet=sum(BRS,b=>byBr[b].net)||1;
 const share=b=>byBr[b].net/totNet;
 const lab=b=>fin['labor_'+(b==='الفحيحيل'?'fah':'sal')]!=null?+fin['labor_'+(b==='الفحيحيل'?'fah':'sal')]:F.labor*share(b);
 const rent=b=>fin['rent_'+(b==='الفحيحيل'?'fah':'sal')]!=null?+fin['rent_'+(b==='الفحيحيل'?'fah':'sal')]:F.rent*share(b);
 /* multi-step */
 const gross=F.netM-F.cogsM, opex=F.labor+F.rent+F.opex+F.commCost, ebit=gross-opex;
 card(v,T('P&L متعدد الخطوات (الأوضح احترافياً)','Multi-step P&L'),`<div class="tw"><table><tbody><tr><td>${T('الإيرادات','Revenue')}</td><td class="n num">${kd(F.netM,0)}</td><td class="n sub">100%</td></tr><tr><td>− ${T('تكلفة البضاعة المباعة','COGS')}</td><td class="n num">${kd(F.cogsM,0)}</td><td class="n sub">${pct(F.fc)}</td></tr><tr style="font-weight:800"><td>= ${T('مجمل الربح','Gross profit')}</td><td class="n num">${kd(gross,0)}</td><td class="n">${pct(100*gross/F.netM)}</td></tr><tr><td>− ${T('المصاريف التشغيلية (عمالة + إيجار + أخرى + عمولات)','Operating expenses')}</td><td class="n num">${F.hasLabor?kd(opex,0):'؟'}</td><td class="n sub">${F.hasLabor?pct(100*opex/F.netM):''}</td></tr><tr style="font-weight:800"><td>= ${T('الربح التشغيلي (EBIT)','Operating profit (EBIT)')}</td><td class="n num" style="color:${!F.hasLabor?'inherit':ebit<0?'var(--bad)':'var(--good)'}">${F.hasLabor&&F.hasRent?kd(ebit,0):'؟'}</td><td class="n">${F.hasLabor&&F.hasRent?pct(100*ebit/F.netM):''}</td></tr><tr><td>− ${T('فوائد وضرائب/زكاة','Interest & tax')}</td><td class="n num">${fin.interest_tax!=null?kd(fin.interest_tax,0):'—'}</td><td></td></tr><tr style="font-weight:800"><td>= ${T('صافي الربح','Net profit')}</td><td class="n num">${F.npPct!=null?kd(F.netProfit-(+fin.interest_tax||0),0):'؟'}</td><td class="n">${F.npPct!=null?pct(100*(F.netProfit-(+fin.interest_tax||0))/F.netM):''}</td></tr></tbody></table></div><p class="sub">${T('مجمل ← تشغيلي ← صافي. الفعلية/التاريخية هنا؛ الـ Pro Forma في تبويب «السيناريوهات» للتمويل والتوسع.','Historical here; Pro Forma in Scenarios.')}</p>`);
 /* segmented by branch */
 card(v,T('P&L مقسّم جغرافياً — حسب الفرع','Segmented P&L — by branch'),`<div class="tw"><table><thead><tr><th>${T('البند','Line')}</th>${BRS.map(b=>`<th class="n">${BRL(b)}</th>`).join('')}</tr></thead><tbody>${[[T('الإيرادات','Revenue'),b=>byBr[b].net],[T('تكلفة البضاعة','COGS'),b=>byBr[b].cogs],[T('مجمل الربح','Gross'),b=>byBr[b].net-byBr[b].cogs],[T('العمالة','Labor')+(fin.labor_fah==null?' *':''),b=>F.hasLabor?lab(b):null],[T('الإيجار','Rent')+(fin.rent_fah==null?' *':''),b=>F.hasRent?rent(b):null],[T('الربح التشغيلي','Operating profit'),b=>F.hasLabor&&F.hasRent?byBr[b].net-byBr[b].cogs-lab(b)-rent(b)-F.opex*share(b)-F.commCost*share(b):null]].map(([l,f])=>`<tr style="${/مجمل|Gross|التشغيلي|Operating/.test(l)?'font-weight:800':''}"><td>${l}</td>${BRS.map(b=>{const x=f(b);return `<td class="n num" style="color:${x!=null&&x<0?'var(--bad)':'inherit'}">${x==null?'؟':kd(x,0)}<div class="sub">${x!=null&&byBr[b].net?pct(100*x/byBr[b].net):''}</div></td>`}).join('')}</tr>`).join('')}</tbody></table></div><p class="sub">${T('* موزّع بحصة المبيعات — أدخل العمالة والإيجار لكل فرع من «إدخال التكاليف» لدقة أعلى. السؤال الحاسم: هل السالمية تربح تشغيلياً بعد إيجارها وعمالتها؟','* allocated by sales share; enter per-branch labor/rent for precision.')}</p>`);
 /* segmented by product line */
 const cats=(S.menu.cats||[]).slice(0,10); const mx=Math.max(...cats.map(c=>c.net),1);
 card(v,T('P&L حسب خط المنتج (الفئة)','Segmented P&L — by product line'),cats.map(c=>hb(`${esc(c.cat)} <span class="sub">${T('هامش','margin')} ${pct(c.margin)}</span>`,c.net,`${kd(c.net,0)} · ${kd(c.net*c.margin/100,0)} ${T('ربح','profit')}`,mx,c.margin>=70?'var(--good)':c.margin>=55?'var(--accent)':'var(--warn)')).join('')+`<p class="sub">${T('مجمل الربح لكل خط قبل توزيع المصاريف — الخط ذو الهامش الأدنى مرشّح لإعادة التسعير أو الحذف.','Gross by line before OPEX allocation.')}</p>`);
}

<script>

 const fb=el('div','row'); fb.style.margin='0 0 8px'; const cats=[...new Set([...live.map(p=>p.cat),...((SEED.ingredients||{}).cats||[])])].filter(Boolean); const fs=el('select','inline',`<option value="">${T('كل الفئات','All')}</option>`+cats.map(c=>`<option ${prodF===c?'selected':''}>${esc(c)}</option>`).join('')); fs.onchange=e=>{prodF=e.target.value;render()}; fb.appendChild(fs); v.appendChild(fb);
 const rows=live.filter(p=>!prodF||p.cat===prodF).sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));
 if(rows.length){ const grid=el('div','grid3'); rows.forEach(p=>{ const sug=p.cost/(targetFC/100); grid.appendChild(el('div','card',`<h3 style="font-size:13.5px">${esc(p.name)} ${p.active===false?'<span class="chip notstarted" style="font-size:9px">'+T('موقوف','inactive')+'</span>':''}<span class="hs">${esc(p.cat)}</span></h3><div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="sub">${T('السعر','Price')} <b class="num">${fmt(p.price,3)}</b></span><span class="sub">${T('التكلفة','Cost')} <b class="num">${fmt(p.cost,3)}</b></span><span class="sub">FC <b class="num" style="color:${p.fc>35?'var(--bad)':p.fc>28?'var(--warn)':'var(--good)'}">${pct(p.fc)}</b></span></div><div class="tw"><table style="font-size:11px"><tbody>${(p.lines||[]).map(l=>`<tr><td>${esc(l.ing)}</td><td class="sub">${fmt(l.qty,2)} ${esc(l.unit||'')}${l.yield&&l.yield<1?` <span class="sub">(yield ${pct(l.yield*100)})</span>`:''}</td><td class="n num">${fmt(l.cost,3)}</td></tr>`).join('')}</tbody></table></div><div class="sub" style="margin-top:6px">${T('هامش/وحدة','CM')} <b class="num">${fmt(p.cm,3)}</b> · ${T('سعر مقترح عند','suggested at')} ${pct(targetFC)}: <b class="num">${fmt(sug,3)}</b>${p.price<sug*0.95?` <span class="chip risk" style="font-size:9px">${T('ارفع السعر','raise')}</span>`:''}</div>${canDo('menu')?`<div class="row" style="margin-top:8px;gap:6px"><button class="btn gh sm" onclick="productForm('${p.id}')">✎ ${T('تعديل الوصفة','Edit recipe')}</button><button class="btn gh sm" onclick="delRec('products','${p.id}')">🗑</button></div>`:''}`)); }); v.appendChild(grid); }
 else v.appendChild(el('div','ins',`${T('لا أصناف مضافة بعد. زر «صنف جديد» يفتح منشئ الوصفة: اختر المكوّن ← الكمية ← يحسب التكلفة. أو انسخ وصفة من فودكس للتعديل من الأسفل.','No products yet — use New product.')}`));

 window._pfSave=async()=>{ const name=$('#pf_name').value.trim(); if(!name){toast(T('الاسم مطلوب','Name required'));return;} const price=+$('#pf_price').value||0; lines=recipeCalc(lines); const cost=sum(lines,l=>l.cost); const d={name,cat:$('#pf_cat').value.trim(),price,active:$('#pf_active').value==='1',lines:lines.map(l=>({ing:l.ing,qty:l.qty,unit:l.unit,yield:l.yield,ucost:l.ucost,cost:l.cost})),cost:Math.round(cost*1000)/1000,fc:price?Math.round(1000*cost/price)/10:0,cm:Math.round((price-cost)*1000)/1000,at:new Date().toISOString(),by:ME.id||null}; if(id)await dbUpd('products',id,d); else await dbAdd('products',d); closeModal(); toast(T('تم حفظ الصنف ✓','Saved')); };
 draw(); }
